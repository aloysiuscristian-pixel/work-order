name: Build APK

on:
  push:
    branches: [main, master]
    paths:
      - 'index.html'
      - 'frontdesk.html'
      - 'native-shim.js'
      - 'icon-512.png'
      - 'debug.keystore'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: pkb
            entry: index.html
            appid: com.ahass.pkb
            appname: AHASS PKB
          - key: frontdesk
            entry: frontdesk.html
            appid: com.ahass.frontdesk
            appname: Front Desk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          mkdir www
          cp "${{ matrix.entry }}" www/index.html
          cp native-shim.js www/
          sed -i '0,/<\/head>/s|</head>|<script src="native-shim.js"></script></head>|' www/index.html
          grep -c 'native-shim.js' www/index.html

      - name: Install Capacitor
        run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7
          cat > capacitor.config.json <<'JSON'
          {"appId":"${{ matrix.appid }}","appName":"${{ matrix.appname }}","webDir":"www"}
          JSON
          npx cap add android

      - name: Customize Android project
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          RES=android/app/src/main/res
          # launcher icons (every density, adaptive + legacy)
          find $RES -name 'ic_launcher*.png' | while read f; do
            s=$(identify -format %w "$f")
            convert icon-512.png -resize ${s}x${s} "$f"
          done
          find $RES -name 'ic_launcher_background.xml' -exec sed -i 's/#FFFFFF/#CC0000/I' {} +
          # red status bar
          find $RES -name 'colors.xml' -exec sed -i 's/#303F9F/#CC0000/I' {} +
          # keep content below the status bar (no edge-to-edge)
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 34/' android/variables.gradle
          # camera for barcode / photo features
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.CAMERA"/><uses-feature android:name="android.hardware.camera" android:required="false"/></manifest>#' android/app/src/main/AndroidManifest.xml
          # fixed signing key so new builds update over old installs
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file('../../debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          GRADLE
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "AHASS-${{ matrix.key }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.key }}
          path: AHASS-${{ matrix.key }}.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" AHASS-*.apk \
            --repo "${{ github.repository }}" \
            --title "APK #${{ github.run_number }}" \
            --notes "Download AHASS-pkb.apk and AHASS-frontdesk.apk, then open them on the tablet to install."
