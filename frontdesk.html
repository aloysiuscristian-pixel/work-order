<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AHASS Cenderawasih Motor 3 · Front Desk</title>
<meta name="theme-color" content="#cc0000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23cc0000'/%3E%3Ctext x='50' y='72' font-size='64' font-weight='900' font-family='Arial,sans-serif' text-anchor='middle' fill='%23fff'%3EA%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f3f3f3;--card:#fff;--tx:#1a1a1a;--mu:#666;--bd:#dcdcdc;--ac:#cc0000;--ok:#15803d;--yl:#ca8a04;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--card:#212121;--tx:#f0f0f0;--mu:#9a9a9a;--bd:#363636;--ac:#ef4444;--ok:#4ade80;--yl:#facc15}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:720px;margin:0 auto;padding:14px}
h2{font-size:15px;margin:0 0 8px;border-left:4px solid var(--ac);padding-left:8px}
.hd{background:#cc0000;color:#fff;padding:10px 14px;border-bottom:3px solid #1a1a1a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hd{background:#a30000}}
.hd .in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.br{display:flex;align-items:center;gap:10px}
.bdg{background:#fff;color:#cc0000;font-weight:900;font-style:italic;letter-spacing:1px;border-radius:6px;padding:3px 9px;font-size:19px;line-height:1.2}
.nm{font-weight:800;font-size:15px;text-transform:uppercase;line-height:1.15}.sb{font-size:11px;opacity:.9}
.card{background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--ac);border-radius:10px;padding:12px;margin-bottom:12px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.s2{grid-column:span 2}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:2px}
input,select,textarea{width:100%;padding:10px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit;min-width:0}
.btn{padding:10px 14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;cursor:pointer;font:inherit;min-height:42px}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.btn.x{color:#b91c1c;padding:10px 0}
.btn:disabled{opacity:.5}
.hd .btn{background:transparent;border-color:rgba(255,255,255,.75);color:#fff;font-size:13px;min-height:36px;padding:6px 10px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.row{display:grid;gap:6px;align-items:end;margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed var(--bd)}
.rs{grid-template-columns:1.4fr 1.2fr 1fr 1.1fr 40px}
.rp{grid-template-columns:2.2fr 70px 1fr 40px}
@media (max-width:640px){.rs{grid-template-columns:1fr 1fr}.rs .x{grid-column:span 2;text-align:right}.rp{grid-template-columns:1fr 70px}.rp .x{grid-column:span 2;text-align:right}}
.ro{padding:8px 0;color:var(--mu);font-size:13px}
.cb{position:relative}.cbl{position:absolute;z-index:20;left:0;right:0;top:100%;max-height:230px;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.cbl div{padding:9px 10px;cursor:pointer;border-bottom:1px solid var(--bd)}.cbl div:hover{background:var(--bg)}.cbl .none{color:var(--mu);cursor:default}
.rec{position:relative;margin:2px 0 10px;padding:10px;border:1px solid var(--ac);border-left-width:4px;border-radius:8px;background:var(--bg);font-size:13px}
.rec .rct{display:block;padding-right:28px}.rec .opts{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
.rec .opt{text-align:left;padding:8px 10px;line-height:1.3;height:auto;white-space:normal}.rec .opt.on{background:var(--ac);border-color:var(--ac);color:#fff}
.rec .rcx{position:absolute;top:6px;right:6px;width:24px;min-height:24px;padding:0;font-size:11px}
.sum div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--bd)}.sum .b{font-weight:700;font-size:16px;border:0}
.q{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}.q:last-child{border:0}
.qn{font-weight:800;color:var(--ac);margin-right:6px}
.st{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;border:1px solid var(--bd);white-space:nowrap}
.st.Done{color:var(--ok);border-color:var(--ok)}.st.IP{color:var(--ac);border-color:var(--ac)}.st.W{color:var(--yl);border-color:var(--yl)}
.mu{color:var(--mu);font-size:12px}
.msg{padding:10px;border-radius:8px;margin-bottom:12px;font-size:14px}
.msg.ok{background:rgba(21,128,61,.12);color:var(--ok);border:1px solid var(--ok)}
.msg.er{background:rgba(185,28,28,.1);color:#b91c1c;border:1px solid #b91c1c}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1}.tabs .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#9a9a9a;margin-right:4px}.dot.on{background:#4ade80}
.rpt{display:grid;grid-template-columns:1.2fr 2fr .6fr 1fr 1fr 1fr;gap:6px;align-items:end;padding:9px 0;border-bottom:1px dashed var(--bd)}
.rpt .v{padding:9px 0;font-weight:600;word-break:break-word}.rpt .sv{grid-column:1/-1;display:flex;gap:8px;align-items:center;justify-content:flex-end}
@media (max-width:640px){.rpt{grid-template-columns:1fr 1fr 1fr}}
.lock{font-size:12px;color:var(--mu)}
.dg{border:2px solid var(--bd);border-radius:10px;margin-bottom:10px;overflow:hidden}
.dgh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:var(--bg);cursor:pointer;user-select:none}
.dgb{padding:0 12px;border-top:1px solid var(--bd)}
.chev{display:inline-block;transition:transform .15s}.chev.cl{transform:rotate(-90deg)}
.warn{border:2px solid var(--ac)}.warn h2{color:var(--ac)}
.hist{padding:7px 0;border-bottom:1px solid var(--bd)}.hist:last-child{border:0}
.scn{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}
.scn .bx{width:100%;max-width:460px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-top:4px solid var(--ac);border-radius:12px;padding:14px}
.scv{position:relative;margin:10px 0;border-radius:8px;overflow:hidden;background:#000;aspect-ratio:4/3}
.scv video{width:100%;height:100%;object-fit:cover;display:block}
.scv .scl{position:absolute;left:10%;right:10%;top:50%;height:2px;background:#ff3b3b;box-shadow:0 0 8px #ff3b3b}
.scm{font-size:13px;color:var(--mu);margin:6px 0 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#111;color:#fff;padding:10px 14px;border-radius:8px;z-index:10001;font-size:14px;max-width:90%}
</style></head><body>
<header class="hd"><div class="in"><div class="br"><span class="bdg">AHASS</span><div><div class="nm">Cenderawasih Motor 3</div><div class="sb">Front Desk</div></div></div>
<div style="display:flex;gap:6px;align-items:center"><span class="sb" id="conn"></span><button class="btn" type="button" onclick="gear()">⚙</button></div></div></header>
<main><div id="app"></div></main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num=v=>parseFloat(v)||0,A=x=>Array.isArray(x)?x:[],T=v=>String(v==null?"":v);
const rp=n=>"Rp "+Math.round(n||0).toLocaleString("id-ID");
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
const MAIN="work-order-data.json",INBOX="frontdesk-inbox.json",CK="fd_cfg",PK="fd_pending",LK="fd_lists2";
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||"null")??d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const L0=()=>({services:[],parts:[],pkgs:[],mechs:[],motors:[],notes:[],plates:{},orders:[]});
const PPK="fd_pp";let PPs=ld(PPK,[]),PQ="",PLim=50,NPF={sku:"",name:"",price:"",jd:"",jt:""},PE={};
let C=ld(CK,{token:"",gid:""}),L=Object.assign(L0(),ld(LK,{})),P=ld(PK,[]),tab="new",F=blank(),msg=null,online=false,busy=false,AF={},AF2={},OF=blankOF();
function blank(){return{plate:"",eng:"",motor:"",cust:"",phone:"",addr:"",note:"",lines:[emptyLine()],pl:[],disc:0,discT:"rp",discN:"",notes:[],NT:{t:"",w:"Out of stock"}}}
function blankOF(){return{plate:"",eng:"",motor:"",cust:"",phone:"",addr:"",name:"",price:"",mech:"",sid:"",sname:"",sprice:"",note:"",pl:[]}}
function emptyLine(m){return{id:uid(),sid:"",name:"",price:0,mech:m||"",pj:""}}

/* ---- plate helpers (same rules as the main app) ---- */
const pk=s=>String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,""),isNP=p=>pk(p)==="NONDS",vk=(p,e)=>pk(p)+(isNP(p)?"|"+pk(e):"");
const normSku=v=>String(v==null?"":v).toLowerCase().replace(/[^a-z0-9]/g,"");
const part=id=>L.parts.find(p=>p.id===id),findSku=c=>{const k=normSku(c);return k?L.parts.find(p=>normSku(p.sku)===k)||null:null};
const pLbl=l=>{const p=part(l.pid);return p?p.sku+" · "+p.name:""};

/* ---- GitHub Gist (same one the main app uses) ---- */
async function gh(path,opt){
 const r=await fetch("https://api.github.com"+path,Object.assign({cache:"no-store"},opt,{headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+C.token,"Content-Type":"application/json"}}));
 if(!r.ok)throw new Error(r.status===401?"Token rejected.":r.status===404?"Not found.":"GitHub error "+r.status);
 return r.json();
}
async function findGist(){for(let p=1;p<=5;p++){const l=await gh("/gists?per_page=100&page="+p);for(const g of l)if(g.files&&g.files[MAIN])return g.id;if(l.length<100)break}return""}
async function fileText(g,name){const f=g.files&&g.files[name];if(!f)return null;if(f.truncated||f.content==null){const r=await fetch(f.raw_url,{cache:"no-store"});return r.ok?r.text():null}return f.content}

/* Read-only copy of what the front desk needs. Profit, reorder cost, tax and mechanic pay are never copied. */
async function refresh(){
 if(!C.token||busy)return;
 try{
  if(!C.gid){C.gid=await findGist();sv(CK,C)}
  if(!C.gid)throw new Error("Main app data not found. Open the main app, connect Sync first.");
  const g=await gh("/gists/"+C.gid),t=await fileText(g,MAIN);
  if(t){const d=JSON.parse(t),td=today(),pl={};
   [...A(d.orders),...A(d.ovh)].filter(x=>(x.cust||x.phone||x.addr)&&pk(x.plate).length>=3&&!(isNP(x.plate)&&!pk(x.eng))).forEach(x=>{const k=vk(x.plate,x.eng),o=pl[k];if(!o||T(x.date)>=o.d)pl[k]={d:T(x.date),c:T(x.cust),p:T(x.phone),a:T(x.addr),m:T(x.motor)}});
   L={services:A(d.services).map(s=>({id:s.id,name:T(s.name),price:num(s.price)})).sort((a,b)=>a.name.localeCompare(b.name)),
      parts:A(d.parts).map(p=>({id:p.id,sku:T(p.sku),name:T(p.name),price:num(p.price),stock:Math.max(0,Math.floor(num(p.stock))),jd:num(p.jd),jt:num(p.jt)})),
      pkgs:A(d.pkgs).map(k=>({id:k.id,name:T(k.name),jd:num(k.jd),jt:num(k.jt),items:A(k.items).map(i=>({sku:T(i.sku),qty:Math.max(1,num(i.qty)||1)}))})),
      mechs:A(d.mechs).map(T).filter(Boolean).sort(),
      motors:A(d.motors).map(T).sort(),
      notes:A(d.notes).filter(n=>!n.done).map(n=>({id:n.id,plate:T(n.plate),eng:T(n.eng),motor:T(n.motor),text:T(n.text),why:T(n.why),date:T(n.date)})),
      plates:pl,
      orders:A(d.orders).filter(o=>!o.po&&(o.date===td||(o.status&&o.status!=="Done"))).map(o=>({id:o.id,queue:o.queue,plate:o.plate,motor:o.motor,cust:o.cust,status:o.status||"Done",date:o.date})).concat(A(d.ovh).filter(o=>o.date===td||(o.status&&o.status!=="Done")).map(o=>({id:o.id,queue:o.queue,plate:o.plate,motor:o.motor,cust:o.cust,status:o.status||"Done",date:o.date,ov:1})))};
   applyPP();sv(LK,L)}
  online=true;
 }catch(e){online=false;if(!msg&&tab==="new")msg={t:"er",m:"Offline or cannot reach the main app: "+e.message}}
 conn();softDraw();
}
/* parts typed here but not yet visible in the main data stay visible (and locked) until the main app has them */
function applyPP(){
 const cut=Date.now()-3*864e5,keep=[];
 PPs.forEach(x=>{if(x.t<=cut)return;const m=L.parts.find(p=>p.id===x.id)||findSku(x.sku);
  if(m){if(num(m.price)>0)return;Object.assign(m,{name:x.name,price:x.price,jd:x.jd,jt:x.jt})}
  else L.parts.push({id:x.id,sku:x.sku,name:x.name,price:x.price,stock:0,jd:x.jd,jt:x.jt});
  keep.push(x)});
 PPs=keep;sv(PPK,PPs)}
function softDraw(){const a=document.activeElement;if(tab==="new"&&a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;draw()}
function conn(){$("conn").innerHTML='<span class="dot '+(online?"on":"")+'"></span>'+(online?"Connected":"Offline")+(P.length?" · "+P.length+" pending":"")}

/* Send: touches only the inbox file, never the main data. */
async function flush(){
 if(!P.length||!C.token||busy)return;busy=true;
 try{
  if(!C.gid){C.gid=await findGist();sv(CK,C)}
  if(!C.gid)throw new Error("no gist");
  const g=await gh("/gists/"+C.gid),t=await fileText(g,INBOX);
  let E=[];try{E=A((JSON.parse(t||"{}")).entries)}catch(e){}
  const cut=Date.now()-3*864e5;E=E.filter(e=>(e.created||0)>cut);
  const ids=new Set(E.map(e=>e.id));P.forEach(e=>{if(!ids.has(e.id))E.push(e)});
  await gh("/gists/"+C.gid,{method:"PATCH",body:JSON.stringify({files:{[INBOX]:{content:JSON.stringify({entries:E})}}})});
  P=[];sv(PK,P);online=true;
 }catch(e){online=false}
 finally{busy=false;conn()}
}

/* ---- totals (customer-facing only) ---- */
function totals(){
 const S=F.lines.reduce((a,l)=>a+num(l.price),0);let pp=0;
 F.pl.forEach(l=>{const p=part(l.pid);if(p)pp+=p.price*l.qty});
 const gross=S+pp,dv=Math.max(0,num(F.disc)),disc=Math.min(gross,F.discT==="pct"?gross*Math.min(dv,100)/100:dv);
 return{S,pp,gross,disc,total:gross-disc};
}
function sumHTML(){const t=totals();
 return `<div><span>Service</span><b>${rp(t.S)}</b></div><div><span>Spareparts</span><b>${rp(t.pp)}</b></div>${t.disc>0?`<div><span>− ${esc(F.discN||"Discount")}</span><b>− ${rp(t.disc)}</b></div>`:""}<div class="b"><span>TOTAL</span><span>${rp(t.total)}</span></div>`}
function calc(){const e=$("sum");if(e)e.innerHTML=sumHTML()}

/* ---- comboboxes ---- */
const srcOf={
 s:(ws)=>L.services.filter(s=>ws.every(w=>s.name.toLowerCase().includes(w))).slice(0,50).map(s=>[s.id,esc(s.name)+' <span class="mu">'+rp(s.price)+"</span>"]),
 p:(ws)=>L.parts.filter(p=>{const h=(p.sku+" "+p.name).toLowerCase();return ws.every(w=>h.includes(w))}).slice(0,40).map(p=>[p.id,esc(p.sku)+" · "+esc(p.name)+' <span class="mu">'+rp(p.price)+" · Stok "+p.stock+"</span>"]),
 k:(ws)=>L.pkgs.filter(k=>{const h=(k.name+" "+k.items.map(i=>i.sku).join(" ")).toLowerCase();return ws.every(w=>h.includes(w))}).slice(0,40).map(k=>[k.id,esc(k.name||"Package")+' <span class="mu">('+k.items.filter(i=>i.sku).length+" items)</span>"])
};
srcOf.v=srcOf.s;srcOf.o=srcOf.p;srcOf.k2=srcOf.k;
function cbOpen(inp,kind,id,all){
 const ws=all?[]:inp.value.toLowerCase().trim().split(/\s+/).filter(Boolean),box=inp.nextElementSibling,m=srcOf[kind](ws);
 box.innerHTML=m.length?m.map(x=>`<div onmousedown="event.preventDefault();cbPick('${kind}','${id}','${x[0]}')">${x[1]}</div>`).join(""):'<div class="none">Nothing found</div>';box.hidden=false}
function cbClose(inp){inp.nextElementSibling.hidden=true;if(inp.dataset.clr)inp.value=""}
const cbIn=(kind,id,val,ph,clr)=>`<div class="cb"><input class="cbi" type="search" autocomplete="off" value="${esc(val)}" placeholder="${ph}" ${clr?'data-clr="1"':""} onfocus="this.select();cbOpen(this,'${kind}','${id}',1)" oninput="cbOpen(this,'${kind}','${id}')" onblur="cbClose(this)"><div class="cbl" hidden></div></div>`;
function cbPick(kind,id,val){const a=document.activeElement;if(a&&a.blur)a.blur();
 if(kind==="s"){const l=F.lines.find(x=>x.id===id),s=L.services.find(x=>x.id===val);if(l&&s){l.sid=s.id;l.name=s.name;l.price=s.price}keep(draw)}
 else if(kind==="p"){const l=F.pl.find(x=>x.id===id);if(l){l.pid=val;if(l.rj)dropRec(l)}keep(draw)}
 else if(kind==="v")pickOV(val)
 else if(kind==="o"){const l=OF.pl.find(x=>x.id===id);if(l){if(l.rj)ovUndo(l);l.rd="";delete l.pk;delete l.pf;l.pid=val}keep(draw)}
 else if(kind==="k2")pkAdd(val,"v")
 else pkAdd(val)}
const keep=f=>{const y=scrollY;f();scrollTo(0,y)};

/* ---- list of work ---- */
function ln(id,k,v){const l=F.lines.find(x=>x.id===id);
 if(k==="mech"&&F.lines.length>1&&F.lines.every(x=>!x.mech)){F.lines.forEach(x=>x.mech=v);keep(draw);return}
 l[k]=v;calc()}
function addLine(){F.lines.push(emptyLine((F.lines.at(-1)||{}).mech));keep(draw)}
function rmLine(id){const x=F.lines.find(a=>a.id===id);if(x&&x.pj){const l=F.pl.find(q=>q.id===x.pj);if(l)l.rj=""}F.lines=F.lines.filter(a=>a.id!==id);if(!F.lines.length)F.lines.push(emptyLine());keep(draw)}

/* ---- spareparts + packages + service-fee recommendation ---- */
const JN={d:"tanpa servis",t:"dengan servis"},jfee=(p,k)=>p?num(k==="d"?p.jd:p.jt):0;
const recSrc=l=>{if(l.pk)return{name:l.pk.n,jd:l.pk.jd,jt:l.pk.jt,pkg:1};const p=part(l.pid);return p?{name:p.name,jd:p.jd,jt:p.jt}:null};
const pkHas=(l,Ls)=>!!(l&&l.pf&&(Ls||F.pl).some(x=>x.id===l.pf&&x.pk));
function recHTML(l){
 const p=recSrc(l);if(l.rd||!p||!(p.jd>0||p.jt>0)||pkHas(l))return"";
 const op=k=>{const f=jfee(p,k);if(!(f>0))return"";return `<button type="button" class="btn opt${l.rj===k?" on":""}" onclick="setRec('${l.id}','${k}')"><b>Add service fee ${JN[k]}</b> · ${rp(f)}</button>`};
 return `<div class="rec"><span class="rct">Service fee to replace ${p.pkg?"package ":""}<b>${esc(p.name)}</b>?</span><button type="button" class="btn rcx" onclick="closeRec('${l.id}')" aria-label="Close">✕</button><div class="opts">${op("d")}${op("t")}</div></div>`}
function closeRec(id){const l=F.pl.find(x=>x.id===id);if(l){if(l.rj)dropRec(l);l.rd=1}keep(draw)}
function setRec(id,k){
 const l=F.pl.find(x=>x.id===id),p=l&&recSrc(l);if(!p)return;
 const i=F.lines.findIndex(x=>x.pj===id);
 if(l.rj===k){if(i>=0)F.lines.splice(i,1);l.rj="";if(!F.lines.length)F.lines.push(emptyLine());keep(draw);return}
 const f=jfee(p,k),nm="Jasa ganti "+(p.pkg?"paket ":"")+p.name+" ("+JN[k]+")";
 if(i>=0){F.lines[i].name=nm;F.lines[i].price=f}
 else{const mech=(F.lines.at(-1)||{}).mech||"",b=F.lines.findIndex(x=>!x.sid&&!x.name&&!num(x.price)&&!x.pj),nl={id:uid(),sid:"",name:nm,price:f,mech,pj:id};

function ovUndo(l){

 if(n){if(sn===n)sn="";else if(sn.includes(" + "+n))sn=sn.replace(" + "+n,"");else if(sn.startsWith(n+" + "))sn=sn.slice(n.length+3)}
 OF.sprice=np>0?String(np):"";OF.sname=np>0?sn:"";l.rj="";l.rjf=0;l.rjn=""}
function ovSetRec(id,k){
 const l=OF.pl.find(x=>x.id===id),p=l&&recSrc(l);if(!p)return;
 if(l.rj===k)ovUndo(l);
 else{ovUndo(l);const fe=jfee(p,k),nm="Jasa ganti "+(p.pkg?"paket ":"")+p.name+" ("+JN[k]+")",sn=String(OF.sname||"");
  OF.sprice=String(num(OF.sprice)+fe);OF.sname=sn?sn+" + "+nm:nm;l.rj=k;l.rjf=fe;l.rjn=nm}
 keep(draw)}
function ovClose(id){const l=OF.pl.find(x=>x.id===id);if(l){if(l.rj)ovUndo(l);l.rd=1}keep(draw)}
function recHTMLO(l){
 const p=recSrc(l);if(l.rd||!p||!(p.jd>0||p.jt>0)||pkHas(l,OF.pl))return"";
 const op=k=>{const fe=jfee(p,k);if(!(fe>0))return"";return `<button type="button" class="btn opt${l.rj===k?" on":""}" onclick="ovSetRec('${l.id}','${k}')"><b>Add service fee ${JN[k]}</b> · ${rp(fe)}</button>`};
 return `<div class="rec"><span class="rct">Service fee to replace ${p.pkg?"package ":""}<b>${esc(p.name)}</b>?</span><button type="button" class="btn rcx" onclick="ovClose('${l.id}')" aria-label="Close">✕</button><div class="opts">${op("d")}${op("t")}</div></div>`}
function opl(id,k,v){const l=OF.pl.find(x=>x.id===id);l[k]=v;if(k==="qty"){const p=part(l.pid),e=$("opp_"+id);if(p&&e)e.textContent=rp(p.price*l.qty);calcO()}}
function rmOPf(id){const l=OF.pl.find(x=>x.id===id);if(l&&l.rj)ovUndo(l);OF.pl=OF.pl.filter(x=>x.id!==id);keep(draw)}
function vOvh(){
 const mo=sel=>`<option value="" ${sel?"":"selected"} disabled>— Select mechanic —</option>`+(L.mechs.includes(sel)||!sel?L.mechs:[...L.mechs,sel]).map(m=>`<option ${m===sel?"selected":""}>${esc(m)}</option>`).join("");
 return `<div class="card"><h2>Overhaul engine job</h2><div class="g">
 <div><label>Plate number</label><input id="g-plate" value="${esc(OF.plate)}" placeholder="DS 1234 AB" autocapitalize="characters" oninput="ovPlate(this.value)"></div>
 <div><label>Motor type</label><input id="g-motor" list="ml" value="${esc(OF.motor)}" placeholder="Honda Beat" oninput="OF.motor=this.value"></div>
 <div><label>Customer name</label><input id="g-cust" value="${esc(OF.cust)}" oninput="OF.cust=this.value" autocomplete="off"></div>
 <div><label>Phone number</label><input id="g-phone" type="tel" inputmode="tel" value="${esc(OF.phone)}" placeholder="08xxxxxxxxxx" oninput="OF.phone=this.value" autocomplete="off"></div>
 <div class="s2"><label>Engine number (only for NON DS — leave empty and it is made automatically)</label><input value="${esc(OF.eng)}" oninput="ovEng(this.value)" autocomplete="off"></div>
 <div class="s2"><label>Address (optional)</label><input id="g-addr" value="${esc(OF.addr)}" oninput="OF.addr=this.value" autocomplete="off"></div>
 <div><label>Overhaul price (Rp)</label><input type="number" inputmode="numeric" value="${esc(OF.price)}" placeholder="0" oninput="OF.price=this.value;calcO()"></div>
 <div><label>Mechanic</label><select onchange="OF.mech=this.value">${mo(OF.mech)}</select></div>
 <div><label>Service type (search)</label>${cbIn("v","ovs",OF.sname,"Search or pick…")}</div>
 <div><label>Service price (Rp)</label><input type="number" inputmode="numeric" value="${esc(OF.sprice)}" placeholder="0" oninput="OF.sprice=this.value;calcO()"></div>
 <div class="s2"><label>Description (optional)</label><input value="${esc(OF.name)}" oninput="OF.name=this.value" placeholder="Engine overhaul"></div>
 <div class="s2"><label>Message for the mechanic (optional)</label><input value="${esc(OF.note)}" oninput="OF.note=this.value"></div></div></div>
 <div id="pna2">${pnAlertO()}</div>
 <div class="card"><h2>Spareparts (optional)</h2>
 ${OF.pl.map(l=>{const p=part(l.pid);return `<div class="row rp"><div><label>Part (search)${p?` <span style="color:${p.stock<=0?"var(--ac)":"var(--mu)"}">· Stock: ${p.stock}${p.stock<=0?" (empty, still allowed)":""}</span>`:""}</label>${cbIn("o",l.id,pLbl(l),"Search SKU or name…")}</div>
 <div><label>Qty</label><input type="number" min="1" value="${l.qty}" oninput="opl('${l.id}','qty',Math.max(1,num(this.value)))"></div>
 <div class="ro">Price<br><b id="opp_${l.id}">${p?rp(p.price*l.qty):"-"}</b></div>
 <button class="btn x" onclick="rmOPf('${l.id}')" aria-label="Remove">✕</button></div>${recHTMLO(l)}`}).join("")}
 <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btn" onclick="OF.pl.push({id:uid(),pid:'',qty:1});keep(draw)">+ Add sparepart</button><button class="btn p" type="button" onclick="openScan('v')">📷 Scan barcode</button>
 ${L.pkgs.length?`<div style="flex:1 1 200px;max-width:340px">${cbIn("k2","new","","📦 Add package (search)…",1)}</div>`:""}</div></div>
 <div class="card sum" id="osum"></div>
 <button class="btn p" style="width:100%" onclick="submitOvh()">Send overhaul to workshop</button>
 <p class="mu" style="margin:8px 0 0">The total is an estimate. The cashier checks and finishes the job in the main app.</p>`;
}
function submitOvh(){
 const plate=OF.plate.trim().toUpperCase(),a=num(OF.price),sp=num(OF.sprice);
 if(!plate){msg={t:"er",m:"Enter the plate number (or NON DS)."};return draw()}
 if(a<=0&&sp<=0){msg={t:"er",m:"Enter the overhaul price or a service price."};return draw()}
 const pl=OF.pl.filter(l=>l.pid).map(l=>({id:l.id,pid:l.pid,qty:Math.max(1,num(l.qty)||1),rj:l.rj||"",rjf:num(l.rjf),rjn:l.rjn||"",rd:l.rd?1:0}));
 const e={id:uid(),created:Date.now(),kind:"ovh",date:today(),plate,eng:OF.eng.trim().toUpperCase(),motor:OF.motor.trim(),cust:OF.cust.trim(),phone:OF.phone.trim(),addr:OF.addr.trim(),name:OF.name.trim(),price:a,mech:OF.mech||"",sid:OF.sid,sname:OF.sname,sprice:sp>0?sp:0,note:OF.note.trim(),pl};
 P.push(e);sv(PK,P);OF=blankOF();AF2={};msg={t:"ok",m:"Overhaul sent to the main app: "+plate+(online?"":" (saved, will send when online)")};scrollTo(0,0);draw();
 flush().then(()=>{setTimeout(refresh,3500)});
}

/* ---- Spareparts: front desk sees only SKU, name, sell price, jasa wo/s, jasa w/s. Input once; only the owner can change a priced part. ---- */
const stkN=p=>Math.max(0,Math.floor(num(p&&p.stock)));
const isOpen=p=>!(num(p.price)>0);
function listHTML(){
 const ws=PQ.toLowerCase().trim().split(/\s+/).filter(Boolean),all=ws.length?L.parts.filter(p=>{const h=(p.sku+" "+p.name).toLowerCase();return ws.every(w=>h.includes(w))}):L.parts;
 const rows=all.slice().sort((a,b)=>(a.sku+" "+a.name).localeCompare(b.sku+" "+b.name,undefined,{numeric:true})).slice(0,PLim);
 if(!rows.length)return '<div class="mu">No spareparts found.</div>';
 return rows.map(p=>{
  if(!isOpen(p))return `<div class="rpt"><div><label>SKU</label><div class="v">${esc(p.sku)}</div></div><div><label>Name</label><div class="v">${esc(p.name)}</div></div><div><label>QTY</label><div class="v">${stkN(p)}</div></div><div><label>Sell price</label><div class="v">${rp(p.price)}</div></div><div><label>Jasa wo/s</label><div class="v">${rp(p.jd)}</div></div><div><label>Jasa w/s</label><div class="v">${rp(p.jt)}</div></div><div class="sv"><span class="lock">🔒 Locked · only the owner can change this</span></div></div>`;
  const e=PE[p.id]||(PE[p.id]={name:p.name,price:"",jd:p.jd||"",jt:p.jt||""});
  return `<div class="rpt"><div><label>SKU</label><div class="v">${esc(p.sku)}</div></div><div><label>Name</label><input value="${esc(e.name)}" oninput="PE['${p.id}'].name=this.value"></div><div><label>QTY</label><div class="v">${stkN(p)}</div></div><div><label>Sell price</label><input type="number" inputmode="numeric" value="${esc(e.price)}" placeholder="0" oninput="PE['${p.id}'].price=this.value"></div><div><label>Jasa wo/s</label><input type="number" inputmode="numeric" value="${esc(e.jd)}" placeholder="0" oninput="PE['${p.id}'].jd=this.value"></div><div><label>Jasa w/s</label><input type="number" inputmode="numeric" value="${esc(e.jt)}" placeholder="0" oninput="PE['${p.id}'].jt=this.value"></div><div class="sv"><span class="lock">Price not set yet · can be entered once</span><button class="btn p" onclick="savePart('${p.id}')">Save</button></div></div>`}).join("")+(all.length>PLim?`<button class="btn" style="margin-top:10px" onclick="PLim+=50;plRefresh()">Show more (${all.length-PLim} left)</button>`:"");
}
function plRefresh(){const e=$("plist");if(e)e.innerHTML=listHTML()}
function vParts(){
 return `<div class="card"><h2>Add sparepart</h2><p class="mu" style="margin:0 0 8px">Enter it once. After saving, the sell price and service fees are locked. If there is a mistake, ask the owner to change it in the main app.</p>
 <div class="g"><div><label>SKU</label><input value="${esc(NPF.sku)}" autocapitalize="characters" autocomplete="off" oninput="NPF.sku=this.value.toUpperCase()"></div><div><label>Name</label><input value="${esc(NPF.name)}" autocomplete="off" oninput="NPF.name=this.value"></div></div>
 <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px"><div><label>Sell price</label><input type="number" inputmode="numeric" value="${esc(NPF.price)}" placeholder="0" oninput="NPF.price=this.value"></div><div><label>Jasa wo/s</label><input type="number" inputmode="numeric" value="${esc(NPF.jd)}" placeholder="0" oninput="NPF.jd=this.value"></div><div><label>Jasa w/s</label><input type="number" inputmode="numeric" value="${esc(NPF.jt)}" placeholder="0" oninput="NPF.jt=this.value"></div></div>
 <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn p" onclick="savePart('')">+ Add sparepart</button><button class="btn" onclick="openScan('sku')">📷 Scan barcode</button></div></div>
 <div class="card"><h2>Spareparts (${L.parts.length})</h2><input type="search" value="${esc(PQ)}" placeholder="Search SKU or name…" oninput="PQ=this.value;PLim=50;plRefresh()" style="margin-bottom:6px"><div id="plist">${listHTML()}</div></div>`;
}
function savePart(id){
 const src=id?PE[id]:NPF;if(!src)return;
 let sku=id?(part(id)||{}).sku:T(NPF.sku).trim().toUpperCase();
 const name=T(src.name).trim(),price=Math.round(num(src.price)),jd=Math.max(0,Math.round(num(src.jd))),jt=Math.max(0,Math.round(num(src.jt)));
 if(!sku){alert("Enter the SKU.");return}
 if(!name){alert("Enter the name.");return}
 if(!(price>0)){alert("Enter the sell price.");return}
 const ex=id?part(id):findSku(sku);
 if(ex&&!isOpen(ex)){alert(ex.sku+" · "+ex.name+" is already in the list and its price is locked. Ask the owner to change it.");return}
 if(!confirm("Save "+sku+" · "+name+"\nSell price "+rp(price)+" · Jasa wo/s "+rp(jd)+" · Jasa w/s "+rp(jt)+"\n\nAfter saving, only the owner can change these. Save?"))return;
 const pid=ex?ex.id:uid();
 P.push({id:uid(),created:Date.now(),kind:"part",pid,sku,name,price,jd,jt});sv(PK,P);
 PPs=PPs.filter(x=>x.id!==pid);PPs.push({id:pid,sku,name,price,jd,jt,t:Date.now()});sv(PPK,PPs);
 if(ex)Object.assign(ex,{name,price,jd,jt});else L.parts.push({id:pid,sku,name,price,stock:0,jd,jt});
 sv(LK,L);if(id)delete PE[id];else NPF={sku:"",name:"",price:"",jd:"",jt:""};
 msg={t:"ok",m:"Saved: "+sku+" · "+name+(online?"":" (will send when online)")};draw();flush().then(()=>setTimeout(refresh,3500));
}
function setup(){
 return `<div class="card"><h2>Connect to the main app</h2>
 <p class="mu" style="margin:0 0 10px">Paste the <b>same GitHub token</b> used in the main app's Sync tab. Everything typed here goes straight to the main app.</p>
 <label>GitHub token</label><input id="tok" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ghp_…">
 <div style="margin:10px 0"><button class="btn p" onclick="connect()">Connect</button></div><p class="mu" id="sm"></p></div>`;
}
async function connect(){
 const t=($("tok").value||"").trim();if(!t){$("sm").textContent="Paste the token first.";return}
 C={token:t,gid:""};$("sm").textContent="Checking…";
 try{await gh("/user");C.gid=await findGist();if(!C.gid)throw new Error("Main app data not found. In the main app open Sync and press Sync now first.");sv(CK,C);msg=null;await refresh();draw()}
 catch(e){C={token:"",gid:""};sv(CK,C);draw();$("sm").textContent="Could not connect: "+e.message}
}
function gear(){if(confirm("Disconnect this device from the main app?")){C={token:"",gid:""};sv(CK,C);draw()}}

draw();refresh();flush();
setInterval(()=>{if(document.visibilityState==="visible"){flush();refresh()}},15000);
addEventListener("online",()=>{flush();refresh()});
</script></body></html>
