<style>
:root{--bg:#f3f3f3;--card:#fff;--tx:#1a1a1a;--mu:#666;--bd:#dcdcdc;--ac:#cc0000;--ok:#15803d;--yl:#ca8a04;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--card:#212121;--tx:#f0f0f0;--mu:#9a9a9a;--bd:#363636;--ac:#ef4444;--ok:#4ade80;--yl:#facc15}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:720px;margin:0 auto;padding:14px}
h2{font-size:15px;margin:0 0 8px;border-left:4px solid var(--ac);padding-left:8px}
.hd{background:#cc0000;color:#fff;padding:10px 14px;border-bottom:3px solid #1a1a1a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hd{background:#a30000}}
.hd .in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.br{display:flex;align-items:center;gap:10px}
.bdg{background:#fff;color:#cc0000;font-weight:900;font-style:italic;letter-spacing:1px;border-radius:6px;padding:3px 9px;font-size:19px;line-height:1.2}
.nm{font-weight:800;font-size:15px;text-transform:uppercase;line-height:1.15}.sb{font-size:11px;opacity:.9}
.card{background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--ac);border-radius:10px;padding:12px;margin-bottom:12px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.s2{grid-column:span 2}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:2px}
input,select,textarea{width:100%;padding:10px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit;min-width:0}
.btn{padding:10px 14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;cursor:pointer;font:inherit;min-height:42px}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.btn.x{color:#b91c1c;padding:10px 0}
.btn:disabled{opacity:.5}
.hd .btn{background:transparent;border-color:rgba(255,255,255,.75);color:#fff;font-size:13px;min-height:36px;padding:6px 10px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.row{display:grid;gap:6px;align-items:end;margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed var(--bd)}
.rs{grid-template-columns:1.4fr 1.2fr 1fr 1.1fr 40px}
.rp{grid-template-columns:2.2fr 70px 1fr 40px}
@media (max-width:640px){.rs{grid-template-columns:1fr 1fr}.rs .x{grid-column:span 2;text-align:right}.rp{grid-template-columns:1fr 70px}.rp .x{grid-column:span 2;text-align:right}}
.ro{padding:8px 0;color:var(--mu);font-size:13px}
.cb{position:relative}.cbl{position:absolute;z-index:20;left:0;right:0;top:100%;max-height:230px;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.cbl div{padding:9px 10px;cursor:pointer;border-bottom:1px solid var(--bd)}.cbl div:hover{background:var(--bg)}.cbl .none{color:var(--mu);cursor:default}
.rec{position:relative;margin:2px 0 10px;padding:10px;border:1px solid var(--ac);border-left-width:4px;border-radius:8px;background:var(--bg);font-size:13px}
.rec .rct{display:block;padding-right:28px}.rec .opts{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
.rec .opt{text-align:left;padding:8px 10px;line-height:1.3;height:auto;white-space:normal}.rec .opt.on{background:var(--ac);border-color:var(--ac);color:#fff}
.rec .rcx{position:absolute;top:6px;right:6px;width:24px;min-height:24px;padding:0;font-size:11px}
.sum div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--bd)}.sum .b{font-weight:700;font-size:16px;border:0}
.q{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}.q:last-child{border:0}
.qn{font-weight:800;color:var(--ac);margin-right:6px}
.st{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;border:1px solid var(--bd);white-space:nowrap}
.st.Done{color:var(--ok);border-color:var(--ok)}.st.IP{color:var(--ac);border-color:var(--ac)}.st.W{color:var(--yl);border-color:var(--yl)}
.mu{color:var(--mu);font-size:12px}
.msg{padding:10px;border-radius:8px;margin-bottom:12px;font-size:14px}
.msg.ok{background:rgba(21,128,61,.12);color:var(--ok);border:1px solid var(--ok)}
.msg.er{background:rgba(185,28,28,.1);color:#b91c1c;border:1px solid #b91c1c}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1}.tabs .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#9a9a9a;margin-right:4px}.dot.on{background:#4ade80}
.rpt{display:grid;grid-template-columns:1.2fr 2fr .6fr 1fr 1fr 1fr;gap:6px;align-items:end;padding:9px 0;border-bottom:1px dashed var(--bd)}
.rpt .v{padding:9px 0;font-weight:600;word-break:break-word}.rpt .sv{grid-column:1/-1;display:flex;gap:8px;align-items:center;justify-content:flex-end}
@media (max-width:640px){.rpt{grid-template-columns:1fr 1fr 1fr}}
.lock{font-size:12px;color:var(--mu)}
.dg{border:2px solid var(--bd);border-radius:10px;margin-bottom:10px;overflow:hidden}
.dgh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:var(--bg);cursor:pointer;user-select:none}
.dgb{padding:0 12px;border-top:1px solid var(--bd)}
.chev{display:inline-block;transition:transform .15s}.chev.cl{transform:rotate(-90deg)}
.card.mn>h2{cursor:pointer;user-select:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card.mn>h2::after{content:"▾";font-size:14px;color:var(--mu);transition:transform .15s}
.card.mn.cl>h2{margin-bottom:0}.card.mn.cl>h2::after{transform:rotate(-90deg)}
.card.mn.cl>:not(h2){display:none!important}
.warn{border:2px solid var(--ac)}.warn h2{color:var(--ac)}
.hist{padding:7px 0;border-bottom:1px solid var(--bd)}.hist:last-child{border:0}
.scn{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}
.scn .bx{width:100%;max-width:460px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-top:4px solid var(--ac);border-radius:12px;padding:14px}
.scv{position:relative;margin:10px 0;border-radius:8px;overflow:hidden;background:#000;aspect-ratio:4/3}
.scv video{width:100%;height:100%;object-fit:cover;display:block}
.scv .scl{position:absolute;left:10%;right:10%;top:50%;height:2px;background:#ff3b3b;box-shadow:0 0 8px #ff3b3b}
.scm{font-size:13px;color:var(--mu);margin:6px 0 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#111;color:#fff;padding:10px 14px;border-radius:8px;z-index:10001;font-size:14px;max-width:90%}

/* ================= MOBILE OPTIMIZATION ================= */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{-webkit-font-smoothing:antialiased}
@media (max-width:700px){body{overflow-x:clip;touch-action:manipulation}}
img,video,canvas,svg{max-width:100%}
button,.btn,select,summary,[onclick]{touch-action:manipulation}
@media (max-width:700px){
  body{font-size:15px}
  main{padding:10px 10px calc(24px + env(safe-area-inset-bottom,0px))!important}
  /* 16px inputs stop iOS Safari auto-zoom on focus; 44px = comfortable thumb target */
  input,select,textarea{font-size:16px!important;min-height:44px;padding:10px!important;border-radius:8px}
  input[type=checkbox],input[type=radio]{min-height:0;width:22px;height:22px;padding:0!important}
  input[type=date],input[type=month],input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;background:var(--bg)}
  label{font-size:12.5px;margin-bottom:3px}
  .btn{min-height:44px!important;padding:10px 14px;border-radius:10px;font-size:15px}
  .btn:active{transform:scale(.97);filter:brightness(.92)}
  .x{min-height:44px;display:flex;align-items:center;justify-content:center}
  .card{padding:12px 10px;border-radius:12px;margin-bottom:10px}
  h1{font-size:18px}
  h2{font-size:15px}
  /* header: compact + sticky, respects notch */
  .hd{padding:8px 12px 14px!important;position:sticky;top:0;z-index:50}
  .hd .in{flex-wrap:nowrap!important;gap:8px}
  .hd .nm{font-size:14px!important;letter-spacing:.3px}
  .hd .sb{font-size:10px!important}
  .bdg{font-size:17px!important;padding:2px 8px!important}
  .hd .btn{min-height:40px!important;padding:6px 10px;font-size:13px}
  /* form grids: single column feels natural on phones, keep 2-col for short numeric fields */
  .g{gap:8px}
  .g>div{min-width:0}
  .row{gap:8px;padding:10px;margin-bottom:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
  /* dropdown suggestions: bigger rows, capped to viewport */
  .cbl{max-height:min(260px,40vh);-webkit-overflow-scrolling:touch}
  .cbl div{padding:12px 10px;min-height:44px}
  /* tables: smooth horizontal scroll, sticky first column */
  .sc{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px;overscroll-behavior-x:contain}
  .sc table{font-size:12.5px!important}
  .sc th:first-child,.sc td:first-child{position:sticky;left:0;background:var(--card);z-index:1}
  /* history rows */
  .hist{padding:10px 0;flex-wrap:wrap}
  .dgh{padding:12px;min-height:48px}
  .dht{min-height:44px}
  .card.mn>h2{min-height:44px}
  /* scanner + modals fill the screen like a sheet */
  .scn{padding:0!important;align-items:flex-end!important}
  .scn .bx{max-width:none!important;border-radius:16px 16px 0 0!important;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))!important;max-height:92vh;overflow:auto}
  .scv{aspect-ratio:3/4}
  /* toast sits above home bar */
  .toast{bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:92%;font-size:14px}
  .ft{font-size:11px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:380px){
  .hd .sb{display:none}
  .btn{padding:10px}
}
@media (hover:none){
  .cbl div:hover{background:transparent}
}
@media (orientation:landscape) and (max-height:480px){
  .hd{position:static}
  .scn .bx{max-height:98vh}
}

@media (max-width:700px){
  main{max-width:none!important}
  .tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:40;background:var(--bg);padding:6px 0;margin:0 -10px 10px;padding-left:10px;padding-right:10px}
  .tabs button{min-height:46px!important;font-weight:600}
  .rs{grid-template-columns:1fr 1fr!important}
  .rs>:first-child{grid-column:1/-1}
  .rs .x,.rp .x{grid-column:1/-1!important}
  .rp{grid-template-columns:1fr 90px!important}
  .rpt{grid-template-columns:1fr 1fr!important;gap:8px;padding:12px 0}
  .rpt .sv{justify-content:stretch}.rpt .sv .btn{flex:1}
  .q{padding:12px 0;flex-wrap:wrap}
  .st{font-size:12px;padding:4px 10px}
  .msg{font-size:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:45}
  .s2{grid-column:1/-1}
  .rec .opts{grid-template-columns:1fr}
  .rec .opt{min-height:48px}
  .rec .rcx{width:32px!important;min-height:32px!important}
  /* primary action buttons: full width, easy thumb reach */
  .card>.btn.p,.card>div>.btn.p:only-child{width:100%;min-height:50px!important;font-size:16px}
  textarea{min-height:88px}
}

  if(SC!==me){h.stop().then(()=>h.clear()).catch(()=>{});return}

 {const bad=bxCheck(OF.pl);if(bad){msg={t:"er",m:bad};return draw()}}

 const e={id:uid(),created:Date.now(),kind:"ovh",date:today(),queue:Math.floor(num(($("g-q")||{}).value||OF.q))||nextQ(),plate,eng:OF.eng.trim().toUpperCase(),motor:OF.motor.trim(),cust:OF.cust.trim(),phone:OF.phone.trim(),addr:OF.addr.trim(),name:OF.name.trim(),price:a,mech:OF.mech||"",sid,sname,sprice:sp>0?sp:0,note:"",pl,sl,notes:OF.notes.map(n=>({id:n.id,text:n.text,why:n.why}))};

/* ---- Spareparts: front desk sees only SKU, name, sell price, jasa wo/s, jasa w/s. Input once; only the owner can change a priced part. ---- */
const stkN=p=>Math.max(0,Math.floor(num(p&&p.stock)));
const isOpen=p=>!(num(p.price)>0);
function listHTML(){
 const ws=PQ.toLowerCase().trim().split(/\s+/).filter(Boolean),all=ws.length?L.parts.filter(p=>{const h=(p.sku+" "+p.name).toLowerCase();return ws.every(w=>h.includes(w))}):L.parts;
 const rows=all.slice().sort((a,b)=>(a.sku+" "+a.name).localeCompare(b.sku+" "+b.name,undefined,{numeric:true})).slice(0,PLim);
 if(!rows.length)return '<div class="mu">No spareparts found.</div>';
 return rows.map(p=>{
  if(!isOpen(p))return `<div class="rpt"><div><label>SKU</label><div class="v">${esc(p.sku)}</div></div><div><label>Name</label><div class="v">${esc(p.name)}</div></div><div><label>QTY</label><div class="v">${stkN(p)}</div></div><div><label>Sell price</label><div class="v">${rp(p.price)}</div></div><div><label>Jasa wo/s</label><div class="v">${rp(p.jd)}</div></div><div><label>Jasa w/s</label><div class="v">${rp(p.jt)}</div></div><div class="sv"><span class="lock">🔒 Locked · only the owner can change this</span></div></div>`;
  const e=PE[p.id]||(PE[p.id]={name:p.name,price:"",jd:p.jd||"",jt:p.jt||""});
  return `<div class="rpt"><div><label>SKU</label><div class="v">${esc(p.sku)}</div></div><div><label>Name</label><input value="${esc(e.name)}" oninput="PE['${p.id}'].name=this.value"></div><div><label>QTY</label><div class="v">${stkN(p)}</div></div><div><label>Sell price</label><input type="number" inputmode="numeric" value="${esc(e.price)}" placeholder="0" oninput="PE['${p.id}'].price=this.value"></div><div><label>Jasa wo/s</label><input type="number" inputmode="numeric" value="${esc(e.jd)}" placeholder="0" oninput="PE['${p.id}'].jd=this.value"></div><div><label>Jasa w/s</label><input type="number" inputmode="numeric" value="${esc(e.jt)}" placeholder="0" oninput="PE['${p.id}'].jt=this.value"></div><div class="sv"><span class="lock">Price not set yet · can be entered once</span><button class="btn p" onclick="savePart('${p.id}')">Save</button></div></div>`}).join("")+(all.length>PLim?`<button class="btn" style="margin-top:10px" onclick="PLim+=50;plRefresh()">Show more (${all.length-PLim} left)</button>`:"");
}
function plRefresh(){const e=$("plist");if(e)e.innerHTML=listHTML()}

function pkListHTML(){
 const ws=PKQ.toLowerCase().trim().split(/\s+/).filter(Boolean),
 all=L.pkgs.filter(k=>{const h=(k.name+" "+k.items.map(i=>{const p=findSku(i.sku);return i.sku+" "+(p?p.name:"")}).join(" ")).toLowerCase();return ws.every(w=>h.includes(w))}).slice().sort((x,y)=>(x.name||"Package").localeCompare(y.name||"Package",undefined,{sensitivity:"base",numeric:true}));
 if(!all.length)return '<div class="mu">No package found.</div>';

function savePart(id){
 const src=id?PE[id]:NPF;if(!src)return;
 let sku=id?(part(id)||{}).sku:T(NPF.sku).trim().toUpperCase();
 const name=T(src.name).trim(),price=Math.round(num(src.price)),jd=Math.max(0,Math.round(num(src.jd))),jt=Math.max(0,Math.round(num(src.jt)));
 if(!sku){alert("Enter the SKU.");return}
 if(!name){alert("Enter the name.");return}
 if(!(price>0)){alert("Enter the sell price.");return}
 const ex=id?part(id):findSku(sku);
 if(ex&&!isOpen(ex)){alert(ex.sku+" · "+ex.name+" is already in the list and its price is locked. Ask the owner to change it.");return}
 if(!confirm("Save "+sku+" · "+name+"\nSell price "+rp(price)+" · Jasa wo/s "+rp(jd)+" · Jasa w/s "+rp(jt)+"\n\nAfter saving, only the owner can change these. Save?"))return;
 const pid=ex?ex.id:uid();
 P.push({id:uid(),created:Date.now(),kind:"part",pid,sku,name,price,jd,jt});sv(PK,P);
 PPs=PPs.filter(x=>x.id!==pid);PPs.push({id:pid,sku,name,price,jd,jt,t:Date.now()});sv(PPK,PPs);
 if(ex)Object.assign(ex,{name,price,jd,jt});else L.parts.push({id:pid,sku,name,price,stock:0,jd,jt});
 sv(LK,L);if(id)delete PE[id];else NPF={sku:"",name:"",price:"",jd:"",jt:""};
 msg={t:"ok",m:"Saved: "+sku+" · "+name+(online?"":" (will send when online)")};draw();flush().then(()=>setTimeout(refresh,3500));
}

async function connect(){
 const t=($("tok").value||"").trim();if(!t){$("sm").textContent="Paste the token first.";return}
 C={token:t,gid:""};$("sm").textContent="Checking…";
 try{await gh("/user");C.gid=await findGist();if(!C.gid)throw new Error("Main app data not found. In the main app open Sync and press Sync now first.");sv(CK,C);msg=null;await refresh();draw()}
 catch(e){C={token:"",gid:""};sv(CK,C);draw();$("sm").textContent="Could not connect: "+e.message}
}
