<script>
const MECH=["ERY","DEDY","KELVIN","RYANDI","FENCE","IMANUEL"];
const SPLIT={m:.68,s:.30,t:.02};
const uid=()=>Math.random().toString(36).slice(2,9);
const rp=n=>"Rp "+Math.round(n||0).toLocaleString("id-ID");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>parseFloat(v)||0;
let D={services:[{id:"s1",name:"Ganti Oli",price:30000},{id:"s2",name:"Service Rutin",price:75000},{id:"s3",name:"Tune Up",price:100000}],
 parts:[{id:"p1",sku:"OLI-10W40",name:"Oli Mesin 10W-40",price:60000,profit:15000},{id:"p2",sku:"KP-001",name:"Kampas Rem Depan",price:45000,profit:12000}],
 orders:[]};
const DEFM=["Honda Beat","Honda Vario 125","Honda Scoopy","Yamaha NMAX","Yamaha Mio","Suzuki Satria"],MECH0=[...MECH];
const cid=v=>String(v==null?"":v).replace(/[^\w-]/g,""),nid=v=>cid(v)||uid(),A=x=>Array.isArray(x)?x:[],T=v=>String(v==null?"":v);
function norm(d){
 d=d&&typeof d==="object"?d:{};
 const mc=A(d.mechs).map(m=>T(m).trim().toUpperCase()).filter(Boolean);
 return{
  services:A(d.services).map(x=>({id:nid(x&&x.id),name:T(x&&x.name),price:num(x&&x.price)})),
  parts:A(d.parts).map(x=>({id:nid(x&&x.id),sku:T(x&&x.sku),name:T(x&&x.name),price:num(x&&x.price),profit:num(x&&x.profit)})),
  orders:A(d.orders).map(o=>{o=o||{};return{id:nid(o.id),queue:(typeof o.queue==="number"||o.queue==="")?o.queue:null,plate:T(o.plate),motor:T(o.motor),date:T(o.date).slice(0,10),
   lines:A(o.lines).map(l=>({id:nid(l&&l.id),sid:cid(l&&l.sid),name:T(l&&l.name),price:num(l&&l.price),mech:T(l&&l.mech)||MECH0[0]})),
   pl:A(o.pl).map(l=>{l=l||{};const r={id:nid(l.id),pid:cid(l.pid),qty:Math.max(1,num(l.qty)||1)};if(l.snap&&typeof l.snap==="object")r.snap={price:num(l.snap.price),profit:num(l.snap.profit),name:T(l.snap.name)};return r}),
   disc:Math.max(0,num(o.disc)),discT:o.discT==="pct"?"pct":"rp",discN:T(o.discN),po:!!o.po,status:o.status?T(o.status):"Done",due:T(o.due),done:T(o.done),
   log:A(o.log).map(g=>({id:nid(g&&g.id),date:T(g&&g.date),note:T(g&&g.note)}))}}),
  motors:Array.isArray(d.motors)?d.motors.map(T):DEFM.slice(),
  mechs:mc.length?mc:MECH0.slice(),
  updated:num(d.updated)};
}
D.motors=DEFM.slice();D.mechs=MECH0.slice();D.updated=0;
try{const s=localStorage.getItem("wo_data");if(s){D=norm(JSON.parse(s));if(!D.updated)D.updated=1}}catch(e){}
MECH.splice(0,MECH.length,...D.mechs);
let saveWarned=false;
const save=()=>{D.updated=Date.now();try{localStorage.setItem("wo_data",JSON.stringify(D))}catch(e){if(!saveWarned){saveWarned=true;alert("Could not save on this device (storage full or blocked). Export a backup.")}}schedPush()};
const blank=()=>({queue:nextQ(today()),plate:"",motor:"",date:today(),lines:[{id:uid(),sid:"",name:"",price:0,mech:""}],pl:[],po:false,status:"Waiting",due:"",done:"",log:[],disc:0,discT:"rp",discN:""});
let O=blank(),tab="order";
const part=id=>D.parts.find(p=>p.id===id);
const srt=(a,f)=>[...a].sort((x,y)=>f(x).localeCompare(f(y),undefined,{numeric:true,sensitivity:'base'}));
const srtS=()=>srt(D.services,s=>s.name),srtP=()=>srt(D.parts,p=>p.sku+' '+p.name);
const byQ=(a,b)=>num(a.queue)-num(b.queue);

function nav(){
 const t=[["order","Work Order"],["proc","Process ("+D.orders.filter(o=>!isDone(o)).length+")"],["services","Services"],["parts","Spareparts"],["motors","Motor Types"],["mechs","Mechanics"],["perf","Mechanic Monthly"],["profit","Profit Monthly"],["tax","Tax Monthly"],["hist","History ("+D.orders.length+")"],["sync","Sync"+(SY.token?" ✓":"")]];
 document.getElementById("nav").innerHTML=t.map(([k,l])=>`<button class="${tab===k?"on":""}" onclick="tab='${k}';draw()">${l}</button>`).join("");
}
function draw(){nav();const v=document.getElementById("v");v.innerHTML={order:vOrder,services:vServ,parts:vParts,perf:vPerf,profit:vProfit,tax:vTax,motors:vMotors,mechs:vMechs,proc:vProc,hist:vHist,sync:vSync}[tab]();if(tab==="order")calc();}

function vOrder(){
 const mo=sel=>(MECH.includes(sel)||!sel?MECH:[...MECH,sel]).map(m=>`<option ${m===sel?"selected":""}>${m}</option>`).join(""),
 mop=sel=>`<option value="" ${sel?"":"selected"} disabled>— Select mechanic —</option>`+mo(sel);
 return `<div class="card"><label style="display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:14px;color:var(--tx);cursor:pointer"><input type="checkbox" style="width:auto;margin:0" ${O.po?"checked":""} onchange="setPO(this.checked)"> Spareparts only (customer just buys parts, no service)</label><div class="g"><div><label>Plate Number${O.po?" (optional)":""}</label><input value="${esc(O.plate)}" oninput="O.plate=this.value.toUpperCase()" placeholder="DS 1234 AB"></div>
 ${motorSel()}
 <div><label>Queue no.</label><input type="number" min="1" value="${O.queue==null?"":O.queue}" oninput="O.queue=this.value===''?'':num(this.value)"></div><div><label>Start date</label><input type="date" value="${O.date}" oninput="O.date=this.value"></div></div></div>
 ${O.po?"":procCard()}${O.po?"":`<div class="card"><h2>List of Work</h2>
 ${O.lines.map(l=>`<div class="row rs"><div class="cb"><label>Service type (search)</label>${cbIn('s',l.id,(D.services.find(x=>x.id===l.sid)||{}).name||"")}</div>
 <div><label>Work description</label><input value="${esc(l.name)}" oninput="ln('${l.id}','name',this.value)"></div>
 <div><label>Service price</label><input type="number" inputmode="numeric" value="${l.price}" oninput="ln('${l.id}','price',num(this.value))"></div>
 <div><label>Mechanic</label><select onchange="ln('${l.id}','mech',this.value)">${mop(l.mech)}</select></div>
 <button class="btn x" onclick="O.lines=O.lines.filter(x=>x.id!=='${l.id}');draw()">✕</button></div>`).join("")}
 <button class="btn" onclick="O.lines.push({id:uid(),sid:'',name:'',price:0,mech:O.lines.at(-1)?.mech||''});draw()">+ Add work</button></div>`}
 <div class="card"><h2>Spareparts</h2>
 ${O.pl.map(l=>{const p=part(l.pid);return `<div class="row rp"><div class="cb"><label>Part (search)</label>${cbIn('p',l.id,p?p.sku+" · "+p.name:"")}</div>
 <div><label>Qty</label><input type="number" min="1" value="${l.qty}" oninput="pl('${l.id}','qty',Math.max(1,num(this.value)))"></div>
 <div class="ro">Price<br><b id="pp_${l.id}">${p?rp(p.price*l.qty):"-"}</b></div><div class="ro">Profit<br><b id="pf_${l.id}">${p?rp(p.profit*l.qty):"-"}</b></div><div class="ro">Reorder<br><b id="pr_${l.id}">${p?rp((p.price-p.profit)*l.qty):"-"}</b></div>
 <button class="btn x" onclick="O.pl=O.pl.filter(x=>x.id!=='${l.id}');draw()">✕</button></div>`}).join("")}
 <button class="btn" onclick="O.pl.push({id:uid(),pid:'',qty:1});draw()">+ Add sparepart</button></div>
 <div class="card"><h2>Discount</h2><div class="g"><div><label>Type</label><select onchange="O.discT=this.value;calc()"><option value="rp" ${O.discT!=="pct"?"selected":""}>Amount (Rp)</option><option value="pct" ${O.discT==="pct"?"selected":""}>Percent (%)</option></select></div>
 <div><label>Discount</label><input type="number" inputmode="decimal" min="0" value="${O.disc||""}" placeholder="0" oninput="O.disc=Math.max(0,num(this.value));calc()"></div>
 <div style="grid-column:span 2"><label>Discount name (optional)</label><input value="${esc(O.discN||"")}" placeholder="e.g. Loyal customer, Promo Oktober" oninput="O.discN=this.value;calc()"></div></div>
 <p style="color:var(--mu);font-size:12px;margin:8px 0 0">Applied to service + spareparts. The mechanic payout and tax stay the same; the store absorbs the discount.</p></div>
<div class="card sum" id="sum"></div>
 <div style="display:flex;gap:8px"><button class="btn p" onclick="saveO()">Save order</button><button class="btn" onclick="if(confirm('Clear form?')){O=blank();draw()}">New</button><button class="btn" onclick="print()">Print</button></div>`;
}
function setPO(v){O.po=v;O.queue=nextQ(O.date,v);if(v){O.status="Done";if(!O.done)O.done=today()}else{O.status="Waiting";O.done="";if(!O.lines.length)O.lines=[{id:uid(),sid:"",name:"",price:0,mech:""}]}draw()}
function pickS(id,sid){const l=O.lines.find(x=>x.id===id),s=D.services.find(x=>x.id===sid);l.sid=sid;if(s){l.name=s.name;l.price=s.price}draw()}
function ln(id,k,v){O.lines.find(x=>x.id===id)[k]=v;calc()}
function pl(id,k,v){const l=O.pl.find(x=>x.id===id);l[k]=v;if(k==="qty"){const p=part(l.pid),q=(a,t)=>{const e=document.getElementById(a+id);if(e)e.textContent=t};if(p){q("pp_",rp(p.price*l.qty));q("pf_",rp(p.profit*l.qty));q("pr_",rp((p.price-p.profit)*l.qty))}calc()}}
function totals(o){
 const S=o.lines.reduce((a,l)=>a+num(l.price),0);
 const by={};o.lines.forEach(l=>by[l.mech]=(by[l.mech]||0)+num(l.price)*SPLIT.m);
 let pp=0,pf=0,pr=0;
 o.pl.forEach(l=>{const p=part(l.pid)||l.snap;if(!p)return;pp+=p.price*l.qty;pf+=p.profit*l.qty;pr+=(p.price-p.profit)*l.qty});
 const gross=S+pp,dv=Math.max(0,num(o.disc)),disc=Math.min(gross,o.discT==="pct"?gross*Math.min(dv,100)/100:dv),store=S*SPLIT.s+pf-disc;
 return{S,by,pp,pf,pr,mech:S*SPLIT.m,storeS:S*SPLIT.s,store,tax:S*SPLIT.t,gross,disc,total:gross-disc};
}
function sumHTML(o){
 const t=totals(o),ms=Object.entries(t.by).filter(([,v])=>v>0);
 return `<div class="h">Service</div><div><span>Service price total</span><b>${rp(t.S)}</b></div>
 <div class="h">Mechanic payout (68% of service)</div>
 ${ms.length?ms.map(([m,v])=>`<div><span>${m}</span><b>${rp(v)}</b></div>`).join(""):`<div><span>-</span><span>-</span></div>`}
 <div><span>Total mechanic payout</span><b>${rp(t.mech)}</b></div>
 <div class="h">Spareparts</div><div><span>Sparepart price</span><b>${rp(t.pp)}</b></div>
 <div><span>Sparepart profit</span><b>${rp(t.pf)}</b></div><div><span>Reorder cost</span><b>${rp(t.pr)}</b></div>
 <div class="h">Customer total</div><div><span>Service + spareparts</span><b>${rp(t.gross)}</b></div>${t.disc>0?`<div><span>${esc(o.discN||"Discount")}${o.discT==="pct"?" ("+num(o.disc)+"%)":""}</span><b>− ${rp(t.disc)}</b></div>`:""}<div class="b"><span>TOTAL TO PAY</span><span>${rp(t.total)}</span></div>

 return `<div class="card"><h2>Process</h2><div class="g"><div><label>Status</label><select onchange="setSt(this.value)">${STAT.map(s=>`<option ${s===O.status?"selected":""}>${s}</option>`).join("")}</select></div>
 <div><label>Estimated finish (due)</label><input type="date" value="${O.due||""}" onchange="O.due=this.value;draw()"></div></div>
 <p style="margin:8px 0;font-size:13px">Day ${days+1} of work${O.due?" · due "+O.due:""}${late?" · <b style='color:#b91c1c'>DELAYED "+daysBetween(O.due,today())+" day(s)</b>":""}${O.done?" · finished "+O.done:""}</p>
 <label>Process log (use it for delays, waiting for parts, next steps)</label>
 ${(O.log||[]).map(g=>`<div class="row" style="grid-template-columns:140px 1fr 36px"><input type="date" value="${g.date}" onchange="lgE('${g.id}','date',this.value)"><input value="${esc(g.note)}" oninput="lgE('${g.id}','note',this.value)" placeholder="What was done / why delayed"><button class="btn x" onclick="O.log=O.log.filter(x=>x.id!=='${g.id}');draw()">✕</button></div>`).join("")}
 <button class="btn" onclick="O.log.push({id:uid(),date:today(),note:''});draw()">+ Add process note</button></div>`;
}
function vProc(){
 const L=D.orders.filter(o=>!isDone(o)).sort((a,b)=>a.date.localeCompare(b.date)||byQ(a,b)),late=L.filter(isLate).length;
 if(!L.length)return `<div class="card">No open jobs. On the Work Order tab set the status to Waiting, In Progress or Waiting for Parts, then press Save order to track a job here over several days.</div>`;
 return `<div class="card"><b>${L.length} open</b>${late?` · <b style="color:#b91c1c">${late} delayed</b>`:""}</div>`+L.map(o=>{
  const ln=[...(o.log||[])].filter(g=>g.note).sort((a,b)=>a.date.localeCompare(b.date)).pop(),lt=isLate(o);
  return `<div class="card" style="${lt?"border-color:#b91c1c":""}"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><div>${qb(o)}<b>${esc(o.plate)}</b> · ${esc(o.motor)}<br><span style="color:var(--mu);font-size:12px">Started ${o.date} · day ${daysBetween(o.date,today())+1}${o.due?" · due "+o.due:""}${lt?" · <b style='color:#b91c1c'>DELAYED "+daysBetween(o.due,today())+" day(s)</b>":""}</span></div>
  <div style="display:flex;gap:6px;align-items:center"><select style="width:auto" onchange="quickSt('${o.id}',this.value)">${STAT.map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select><button class="btn" onclick="openO('${o.id}')">Open</button></div></div>${ln?`<div style="margin-top:6px;font-size:13px;color:var(--mu)">Last note (${ln.date}): ${esc(ln.note)}</div>`:""}</div>`}).join("");
}
function nextQ(d,po){return Math.max(0,...D.orders.filter(o=>o.date===d&&!!o.po===!!po).map(o=>num(o.queue)))+1}
function qb(o,c){if(o.queue==null||o.queue==="")return "";if(c==="w")return '<b style="color:#fff;background:var(--mu);border-radius:6px;padding:1px 6px">#'+esc(o.queue)+'</b> ';return '<b style="color:'+(c||'var(--ac)')+'">#'+esc(o.queue)+'</b> '}
function vPerf(){
 const st=stats(),months=[...new Set([PM,...Object.keys(st)])].sort().reverse(),cur=st[PM]||{};
 const rows=allMech().map(m=>{const x=cur[m]||{jobs:0,rev:0};return{m,jobs:x.jobs,rev:x.rev,pay:x.rev*SPLIT.m}});
 const max=Math.max(1,...rows.map(r=>r.pay)),tj=rows.reduce((a,r)=>a+r.jobs,0),tr=rows.reduce((a,r)=>a+r.rev,0);
 const ranked=[...rows].sort((a,b)=>b.pay-a.pay);
 return `<div class="card"><div style="display:flex;gap:8px;align-items:end;flex-wrap:wrap"><div style="flex:1;min-width:180px"><label>Month</label><select onchange="PM=this.value;draw()">${months.map(m=>`<option value="${m}" ${m===PM?"selected":""}>${mName(m)}</option>`).join("")}</select></div></div></div>
 <div class="card"><h2>Performance &amp; payout · ${mName(PM)}</h2><div class="sc">
 <table style="width:100%;border-collapse:collapse"><tr style="color:var(--mu);font-size:12px;text-align:right"><th style="text-align:left;padding:6px">Mechanic</th><th>Jobs</th><th>Service revenue</th><th>Payout (68%)</th></tr>
 ${ranked.map((r,i)=>`<tr style="border-top:1px solid var(--bd);text-align:right"><td style="text-align:left;padding:8px 6px"><b>${r.pay>0&&i===0?"🏆 ":""}${r.m}</b><div style="height:6px;border-radius:3px;background:var(--ac);width:${r.pay/max*100}%;margin-top:4px;opacity:.85"></div></td><td>${r.jobs}</td><td>${rp(r.rev)}</td><td><b>${rp(r.pay)}</b></td></tr>`).join("")}
 <tr style="border-top:2px solid var(--bd);text-align:right;font-weight:700"><td style="text-align:left;padding:8px 6px">TOTAL</td><td>${tj}</td><td>${rp(tr)}</td><td>${rp(tr*SPLIT.m)}</td></tr></table></div></div>
 <div class="card"><h2>Payout by month</h2><div class="sc"><table style="width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap"><tr style="color:var(--mu);font-size:12px;text-align:right"><th style="text-align:left;padding:6px">Month</th>${allMech().map(m=>`<th style="padding:0 6px">${m}</th>`).join("")}<th style="padding:0 6px">Total</th></tr>
 ${months.map(mo=>{const s=st[mo]||{};const t=allMech().reduce((a,m)=>a+(s[m]?s[m].rev*SPLIT.m:0),0);return `<tr style="border-top:1px solid var(--bd);text-align:right"><td style="text-align:left;padding:8px 6px">${mName(mo)}</td>${allMech().map(m=>`<td style="padding:0 6px">${s[m]?rp(s[m].rev*SPLIT.m):"-"}</td>`).join("")}<td style="padding:0 6px"><b>${rp(t)}</b></td></tr>`}).join("")}</table></div>
 <p style="color:var(--mu);font-size:12px">Based on finished orders (status Done), grouped by the finish date. Jobs = number of work lines done by that mechanic.</p></div>`;
}


/* ---------- search helpers ---------- */
const cbIn=(k,id,v)=>`<input class="cbi" autocomplete="off" value="${esc(v)}" placeholder="${k==="s"?"Search or pick…":"Search part…"}" onfocus="this.select();cbOpen(this,'${k}','${id}',1)" oninput="cbOpen(this,'${k}','${id}')" onblur="cbClose(this,'${k}','${id}')"><div class="cbl" hidden></div>`;
function cbOpen(inp,k,id,all){
 const q=all?"":inp.value.toLowerCase().trim(),box=inp.nextElementSibling;
 const src=k==="s"?srtS().map(s=>({id:s.id,t:s.name+" · "+rp(s.price),q:s.name})):srtP().map(p=>({id:p.id,t:p.sku+" · "+p.name+" · "+rp(p.price),q:p.sku+" "+p.name}));
 const m=src.filter(x=>x.q.toLowerCase().includes(q)).slice(0,50),f=k==="s"?"pickS":"pickP";
 box.innerHTML=(k==="s"?`<div onmousedown="event.preventDefault();pickS('${id}','')">Custom (type your own)…</div>`:"")+(m.length?m.map(x=>`<div onmousedown="event.preventDefault();${f}('${id}','${x.id}')">${esc(x.t)}</div>`).join(""):`<div class="none">No match</div>`);
 box.hidden=false;
}
function cbClose(inp,k,id){
 const box=inp.nextElementSibling;box.hidden=true;
 const cur=k==="s"?(D.services.find(x=>x.id===(O.lines.find(l=>l.id===id)||{}).sid)||{}).name:(()=>{const p=part((O.pl.find(l=>l.id===id)||{}).pid);return p?p.sku+" · "+p.name:""})();
 inp.value=cur||"";
}
function pickP(id,pid){pl(id,"pid",pid);draw()}
function flt(inp){const q=inp.value.toLowerCase().trim();inp.closest(".card").querySelectorAll(".row").forEach(r=>{const t=[...r.querySelectorAll("input")].map(i=>i.value).join(" ").toLowerCase();r.style.display=t.includes(q)?"":"none"})}
/* ---------- Excel library (loaded only when needed) ---------- */
let xP=null;
const loadScript=u=>new Promise((ok,no)=>{const e=document.createElement("script");e.src=u;e.onload=ok;e.onerror=()=>no(new Error("load"));document.head.appendChild(e)});
function loadX(){if(window.XLSX)return Promise.resolve();return xP=xP||loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js").catch(()=>loadScript("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js")).then(()=>{if(!window.XLSX)throw new Error("x")}).catch(e=>{xP=null;throw e})}

/* ---------- Cloud sync via private GitHub Gist ---------- */
const SYK="wo_sync",GF="work-order-data.json",GD="Work Order App Data";
let SY={token:"",gid:"",base:0,auto:true,last:0,msg:""},syBusy=false,syT=null;
try{const x=JSON.parse(localStorage.getItem(SYK)||"{}");for(const k of["token","gid","base","auto","last"])if(k in x)SY[k]=x[k]}catch(e){}
const sySave=()=>{try{localStorage.setItem(SYK,JSON.stringify({token:SY.token,gid:SY.gid,base:SY.base,auto:SY.auto,last:SY.last}))}catch(e){}};
function syMsg(t,bad){SY.msg=t;const e=document.getElementById("symsg");if(e){e.textContent=t;e.style.color=bad?"#b91c1c":"var(--mu)"}}
async function gh(path,opt){
 const r=await fetch("https://api.github.com"+path,Object.assign({},opt,{headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+SY.token,"Content-Type":"application/json"}}));
 if(!r.ok){let m="";try{m=(await r.json()).message||""}catch(e){}
  throw new Error(r.status===401?"Token rejected. Make sure it is a classic token with the gist scope.":r.status===403||r.status===429?"GitHub refused the request ("+(m||"rate limit or missing permission")+")":r.status===404?"Not found (does the token have the gist scope?)":"GitHub error "+r.status+(m?": "+m:""))}
 return r.json();
}
async function syFind(){for(let p=1;p<=5;p++){const l=await gh("/gists?per_page=100&page="+p);for(const g of l)if(g.files&&g.files[GF])return g.id;if(l.length<100)break}return""}
async function syGet(){
 const g=await gh("/gists/"+SY.gid),f=g.files&&g.files[GF];if(!f)throw new Error("Cloud file is missing from the gist");
 let t=f.content;if(f.truncated||t==null){const r=await fetch(f.raw_url);if(!r.ok)throw new Error("Could not download cloud data");t=await r.text()}
 return JSON.parse(t);
}
async function syPush(){
 const u=D.updated,body=JSON.stringify({files:{[GF]:{content:JSON.stringify(D)}}});
 if(!SY.gid){const g=await gh("/gists",{method:"POST",body:JSON.stringify({description:GD,public:false,files:{[GF]:{content:JSON.stringify(D)}}})});SY.gid=g.id}
 else await gh("/gists/"+SY.gid,{method:"PATCH",body});
 SY.base=u;SY.last=Date.now();sySave();
}
function syPull(R){
 D=norm(R);MECH.splice(0,MECH.length,...D.mechs);
 try{localStorage.setItem("wo_data",JSON.stringify(D))}catch(e){}
 SY.base=D.updated;SY.last=Date.now();sySave();draw();
}
const syT_=()=>new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
async function sySync(manual){
 if(!SY.token||syBusy)return;
 syBusy=true;if(manual)syMsg("Syncing…");let ok=false;
 try{
  if(!SY.gid){SY.gid=await syFind();sySave()}
  if(!SY.gid){await syPush();syMsg("Cloud backup created ("+syT_()+").");ok=true}
  else{
   const R=await syGet(),rU=num(R&&R.updated),lc=D.updated>SY.base,rc=rU>SY.base;
   if(rU===D.updated){SY.base=D.updated;SY.last=Date.now();sySave();syMsg("Up to date ("+syT_()+").");ok=true}
   else if(!lc&&!rc){syMsg("Up to date ("+syT_()+").");ok=true}
   else if(lc&&!rc){await syPush();syMsg("Uploaded changes ("+syT_()+").");ok=true}
   else if(rc&&!lc){syPull(R);syMsg("Downloaded newer data ("+syT_()+").");ok=true}
   else if(!manual){syMsg("Conflict: this device and the cloud both changed. Open the Sync tab and press Sync now.",true)}
   else if(confirm("Both this device and the cloud have changes.\n\nOK = keep THIS device's data (overwrites cloud)\nCancel = more options")){await syPush();syMsg("Uploaded this device's data ("+syT_()+").");ok=true}
   else if(confirm("Use the CLOUD data instead? This replaces the data on this device.")){syPull(R);syMsg("Downloaded cloud data ("+syT_()+").");ok=true}
   else syMsg("Sync cancelled. Nothing was changed.");
  }
 }catch(e){syMsg("Sync failed: "+(e&&e.message||e),true)}
 finally{syBusy=false;if(tab==="sync"&&manual)draw(),syMsg(SY.msg,SY.msg.startsWith("Sync failed")||SY.msg.startsWith("Conflict"));if(ok&&D.updated>SY.base)schedPush()}
}
function schedPush(){if(!SY.token||!SY.auto)return;clearTimeout(syT);syT=setTimeout(()=>syBusy?schedPush():sySync(false),3000)}
async function syForce(dir){
 if(!SY.token||syBusy)return;
 if(!confirm(dir==="up"?"Overwrite the cloud copy with this device's data?":"Overwrite this device's data with the cloud copy?"))return;
 syBusy=true;syMsg("Working…");
 try{
  if(!SY.gid){SY.gid=await syFind();sySave()}
  if(dir==="up"){await syPush();syMsg("Uploaded ("+syT_()+").")}
  else{if(!SY.gid)throw new Error("No cloud copy exists yet");syPull(await syGet());syMsg("Downloaded ("+syT_()+").")}
 }catch(e){syMsg("Failed: "+(e&&e.message||e),true)}
 finally{syBusy=false;if(tab==="sync"){const m=SY.msg;draw();syMsg(m,m.startsWith("Failed"))}}
}
async function syOn(){
 const t=(document.getElementById("sytok").value||"").trim();if(!t){syMsg("Paste your token first.",true);return}
 SY.token=t;syMsg("Checking token…");
 try{const u=await gh("/user");SY.gid="";SY.base=0;sySave();syMsg("Connected as "+u.login+".");draw();sySync(true)}
 catch(e){SY.token="";syMsg("Could not connect: "+(e&&e.message||e),true)}
}
function syOff(){if(confirm("Disconnect this device from cloud sync? Your data stays on this device and in the cloud.")){clearTimeout(syT);SY.token="";SY.gid="";SY.base=0;SY.last=0;SY.msg="";sySave();draw()}}
function dl(name,blob){const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function jBackup(){dl("work-orders-backup-"+today()+".json",new Blob([JSON.stringify(D,null,1)],{type:"application/json"}))}
function jRestore(inp){
 const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=e=>{try{const x=JSON.parse(e.target.result);if(!x||!Array.isArray(x.orders))throw new Error("not a backup from this app");
  if(!confirm("Replace all current data with this backup?"))return;
  D=norm(x);MECH.splice(0,MECH.length,...D.mechs);O=blank();save();draw();syMsg("Backup restored.")}catch(err){syMsg("Restore failed: "+err.message,true)}};
 r.readAsText(f);inp.value="";
}
function vSync(){
 const on=!!SY.token,sm="font-size:13px;color:var(--mu)";
 return `<div class="card"><h2>Cloud sync (GitHub)</h2>
 <p style="${sm};margin:0 0 10px">Keeps your data the same on every phone and computer. It is stored in a <b>private Gist in your own GitHub account</b>, never in the public repository. The app keeps working offline and syncs when you are back online.</p>
 ${on?`<div class="sum"><div><span>Status</span><b class="store">Connected</b></div><div><span>Cloud copy</span><b>${SY.gid?"found":"will be created"}</b></div><div><span>Last sync</span><b>${SY.last?esc(new Date(SY.last).toLocaleString()):"-"}</b></div></div>
 <label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--tx);margin:10px 0"><input type="checkbox" style="width:auto" ${SY.auto?"checked":""} onchange="SY.auto=this.checked;sySave()"> Sync automatically after changes</label>
 <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn p" onclick="sySync(true)">⟳ Sync now</button><button class="btn" onclick="syForce('up')">⬆ Force upload</button><button class="btn" onclick="syForce('down')">⬇ Force download</button><button class="btn" style="color:#b91c1c" onclick="syOff()">Disconnect</button></div>`
 :`<label>GitHub token</label><input id="sytok" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ghp_…">
 <div style="margin:10px 0"><button class="btn p" onclick="syOn()">Connect</button></div>
 <ol style="${sm};padding-left:18px;margin:0">
 <li>On GitHub open Settings → Developer settings → Personal access tokens → <b>Tokens (classic)</b>.</li>
 <li>Generate a new token, tick only the <b>gist</b> scope, and copy it.</li>
 <li>Paste it above and press Connect. Repeat on your other devices with the same token.</li></ol>
 <p style="${sm}">The token is kept only in this browser. Do not share it.</p>`}
 <p id="symsg" style="${sm};margin:10px 0 0">${esc(SY.msg||"")}</p></div>
 <div class="card"><h2>Backup file</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="jBackup()">⬇ Download backup (.json)</button><label class="btn" style="margin:0;font-size:15px;color:var(--tx)">⬆ Restore backup<input type="file" accept=".json,application/json" style="display:none" onchange="jRestore(this)"></label></div>
 <p style="${sm};margin:8px 0 0">Use this to move data from an older copy of the app. Excel export and import are on the History tab.</p></div>`;
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")sySync(false)});
window.addEventListener("online",()=>sySync(false));
draw();
sySync(false);
</script>
