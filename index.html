.sum div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--bd)}
.sum .b{font-weight:700;font-size:16px}.sum .tp{color:var(--navy)}.sum .h{color:var(--mu);font-size:12px;border:0;padding-top:10px;text-transform:uppercase;letter-spacing:.04em}
.store{color:var(--ok)}
.day{border-radius:10px;padding:6px 10px;margin-bottom:12px}.day .hist:last-child{border-bottom:0}

.card.mn>h2{cursor:pointer;user-select:none;display:flex;justify-content:space-between;align-items:center;gap:8px}

.btn{min-height:38px}

h2{border-left:4px solid var(--ac);border-right:4px solid var(--ac);padding-left:8px;padding-right:8px}

const SYK="wo_sync",GF="work-order-data.json",GD="Work Order App Data";
let SY={token:"",gid:"",base:0,auto:true,last:0,msg:""},syBusy=false,syT=null;
try{const x=JSON.parse(localStorage.getItem(SYK)||"{}");for(const k of["token","gid","base","auto","last"])if(k in x)SY[k]=x[k]}catch(e){}

async function gh(path,opt){

 if(!r.ok){let m="";try{m=(await r.json()).message||""}catch(e){}
  throw new Error(r.status===401?"Token rejected. Make sure it is a classic token with the gist scope.":r.status===403||r.status===429?"GitHub refused the request ("+(m||"rate limit or missing permission")+")":r.status===404?"Not found (does the token have the gist scope?)":"GitHub error "+r.status+(m?": "+m:""))}

}
async function syFind(){for(let p=1;p<=5;p++){const l=await gh("/gists?per_page=100&page="+p);for(const g of l)if(g.files&&g.files[GF])return g.id;if(l.length<100)break}return""}

 let t=f.content;if(f.truncated||t==null){const r=await fetch(f.raw_url,{cache:"no-store"});if(!r.ok)throw new Error("Could not download cloud data");t=await r.text()}

async function syPush(){

 if(!SY.gid){const g=await gh("/gists",{method:"POST",body:JSON.stringify({description:GD,public:false,files:{[GF]:{content:JSON.stringify(D)}}})});SY.gid=g.id}

}
const syT_=()=>new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
async function sySync(manual){
 if(!SY.token||syBusy)return;
 syBusy=true;if(manual)syMsg("Syncing…");let ok=false;
 try{
  if(!SY.gid){SY.gid=await syFind();sySave()}
  if(!SY.gid){await syPush();syMsg("Cloud backup created ("+syT_()+").");ok=true}
  else{
   const R=await syGet(),rU=num(R&&R.updated),lc=D.updated>SY.base,rc=rU>SY.base;
   if(rU===D.updated){SY.base=D.updated;SY.last=Date.now();sySave();syMsg("Up to date ("+syT_()+").");ok=true}
   else if(!lc&&!rc){syMsg("Up to date ("+syT_()+").");ok=true}
   else if(lc&&!rc){await syPush();syMsg("Uploaded changes ("+syT_()+").");ok=true}
   else if(rc&&!lc){syPull(R);syMsg("Downloaded newer data ("+syT_()+").");ok=true}
   else if(!manual){syMsg("Conflict: this device and the cloud both changed. Open the Sync tab and press Sync now.",true)}
   else if(confirm("Both this device and the cloud have changes.\n\nOK = keep THIS device's data (overwrites cloud)\nCancel = more options")){await syPush();syMsg("Uploaded this device's data ("+syT_()+").");ok=true}
   else if(confirm("Use the CLOUD data instead? This replaces the data on this device.")){syPull(R);syMsg("Downloaded cloud data ("+syT_()+").");ok=true}
   else syMsg("Sync cancelled. Nothing was changed.");
  }
 }catch(e){syMsg("Sync failed: "+(e&&e.message||e),true)}
 finally{syBusy=false;if(tab==="sync"&&manual)draw(),syMsg(SY.msg,SY.msg.startsWith("Sync failed")||SY.msg.startsWith("Conflict"));if(ok&&D.updated>SY.base)schedPush()}

const fdGone=id=>(D.fdDel||[]).includes(cid(id));
function fdTomb(id){id=cid(id);if(!id)return;if(!D.fdDel)D.fdDel=[];
 [id,id.replace(/sp$/,"")].forEach(x=>{if(x&&!D.fdDel.includes(x))D.fdDel.push(x);fdSeen.add(x)});

 try{fdDismiss()}catch(x){}/* deleting data also clears the "new from front desk" banner */

/* remove deleted items from the shared inbox itself, so no device (new phone, incognito) can ever re-import them */
const fdDead=e=>e&&(fdGone(e.id)||(e.kind==="part"&&fdGone(e.pid)));
async function fdPurge(g){

 try{
  g=g||await gh("/gists/"+SY.gid);const f=g.files&&g.files[FDF];if(!f)return;
  let t=f.content;if(f.truncated||t==null){const r=await fetch(f.raw_url,{cache:"no-store"});t=await r.text()}
  const E=A((JSON.parse(t)||{}).entries),K=E.filter(e=>!fdDead(e));
  if(K.length!==E.length)await gh("/gists/"+SY.gid,{method:"PATCH",body:JSON.stringify({files:{[FDF]:{content:JSON.stringify({entries:K})}}})});
 }catch(e){}
}
function fdApply(e){
 if(e.kind==="ovh"){
  const d=T(e.date).slice(0,10)||today(),plate=T(e.plate).toUpperCase(),a=num(e.price),sp=num(e.sprice);let eng=T(e.eng).toUpperCase();
  const sl=A(e.sl).map(l=>{l=l||{};const s0=D.services.find(x=>x.id===cid(l.sid));return{id:nid(l.id),sid:s0?s0.id:"",name:T(l.name)||(s0?s0.name:""),price:num(l.price),mech:MECH.includes(T(l.mech))?T(l.mech):"",pj:"",sp:1}}).filter(l=>l.price>0);
  const nts=A(e.notes).filter(n=>n&&T(n.text).trim());
  if(a<=0&&sp<=0&&!sl.length&&!nts.length)return 0;if(isNP(plate)&&!eng)eng=nextEng();
  const svc=D.services.find(x=>x.id===cid(e.sid)),
   pl=A(e.pl).filter(l=>l&&part(cid(l.pid))).map(l=>{const p=part(cid(l.pid));return{id:nid(l.id),pid:cid(l.pid),qty:Math.max(1,num(l.qty)||1),rj:(l.rj==="d"||l.rj==="t")?l.rj:"",rjf:num(l.rjf),rjn:T(l.rjn),rd:l.rd?1:0,snap:{sku:p.sku,price:p.price,profit:p.profit,name:p.name}}});
  const fq=Math.floor(num(e.queue));let add=0,q=fq>0?fq:nextQ(d,false);/* pakai nomor antrian yang diketik di front desk */
  nts.forEach(n=>{const id=nid(n.id);if(D.notes.some(x=>x.id===id)||fdGone(id))return;D.notes.push({id,plate,eng,motor:T(e.motor),text:T(n.text).trim(),why:T(n.why),date:d,done:false});add++});
  if(a>0||sp>0){D.ovh.unshift({id:cid(e.id),edited:today(),status:"Waiting",due:"",done:"",log:e.note?[{id:uid(),date:d,note:"Front desk: "+T(e.note)}]:[],date:d,queue:q,plate,eng,motor:T(e.motor),cust:T(e.cust),phone:T(e.phone),addr:T(e.addr),
   name:T(e.name).trim()||(a>0?"Engine overhaul":(T(e.sname)||"Service")),price:a,sname:sp>0?(T(e.sname)||(svc?svc.name:"Service")):"",sprice:sp>0?sp:0,mech:MECH.includes(T(e.mech))?T(e.mech):"",pl:ovDed(pl)});add++}
  if(sl.length){/* Jasa Spesial typed in Turmes: kept as its own Work Order so the 80% mechanic / 20% store split works as usual */
   D.orders.unshift({id:add?cid(e.id)+"sp":cid(e.id),queue:q,plate,eng,motor:T(e.motor),cust:T(e.cust),phone:T(e.phone),addr:T(e.addr),date:d,lines:sl,pl:[],disc:0,discT:"rp",discN:"",po:false,status:"Waiting",due:"",done:"",edited:today(),log:[{id:uid(),date:d,note:"Front desk: Jasa Spesial dari Turmes"+(e.note?" · "+T(e.note):"")}]});add++}
  return add}
 if(e.kind==="queue"){/* queue number edited on the front desk */
  const o=(e.ov?D.ovh:D.orders).find(x=>String(x.id)===String(e.oid)),q=Math.floor(num(e.queue));
  if(o&&q>0&&o.queue!==q){o.queue=q;o.edited=today()}
  return 0}
 if(e.kind==="cancel"){/* PKB cancelled on the front desk: only while still Waiting; stock goes back */
  const arr=e.ov?D.ovh:D.orders,o=arr.find(x=>String(x.id)===String(e.oid));
  if(o&&o.status==="Waiting"){
   if(e.ov)(o.pl||[]).forEach(stkBack);else stockSync(o.pl||[],[]);
   arr.splice(arr.indexOf(o),1)}
  return 0}
 if(e.kind==="part"){
  const sku=T(e.sku).trim(),p=part(cid(e.pid))||findSku(sku);
  if(p){if(num(p.price)===0&&num(e.price)>0){p.name=T(e.name).trim()||p.name;p.price=num(e.price);p.jd=num(e.jd);p.jt=num(e.jt);if(!(num(p.profit)>0))p.fd=1;PH.delete(p);SPc=null;return 1}return 0}
  if(!sku||!T(e.name).trim()||!(num(e.price)>0))return 0;
  D.parts.push({id:nid(e.pid),sku,name:T(e.name).trim(),price:num(e.price),profit:0,stock:0,jd:num(e.jd),jt:num(e.jt),fd:1});SPc=null;return 1}
 const d=T(e.date).slice(0,10)||today(),plate=T(e.plate).toUpperCase();
 let eng=T(e.eng).toUpperCase();if(isNP(plate)&&!eng)eng=nextEng();
 const lines=A(e.lines).map(l=>{l=l||{};const s=D.services.find(x=>x.id===cid(l.sid));return{id:nid(l.id),sid:s?s.id:"",name:T(l.name)||(s?s.name:""),price:num(l.price),mech:MECH.includes(T(l.mech))?T(l.mech):"",pj:cid(l.pj),sp:l.sp?1:0}});
 const pl=A(e.pl).filter(l=>l&&part(cid(l.pid))).map(l=>{const r={id:nid(l.id),pid:cid(l.pid),qty:Math.max(1,num(l.qty)||1)};
  if(l.rj==="d"||l.rj==="t")r.rj=l.rj;if(l.rd)r.rd=1;if(l.pk&&typeof l.pk==="object")r.pk={n:T(l.pk.n),jd:num(l.pk.jd),jt:num(l.pk.jt)};if(l.pf)r.pf=T(l.pf);
  const p=part(r.pid);r.snap={sku:p.sku,price:p.price,profit:p.profit,name:p.name};return r});
 let add=0;
 A(e.notes).forEach(n=>{n=n||{};const id=nid(n.id);if(!T(n.text).trim()||D.notes.some(x=>x.id===id)||fdGone(id))return;
  D.notes.push({id,plate,eng,motor:T(e.motor),text:T(n.text).trim(),why:T(n.why),date:d,done:false});add++});
 if(lines.length||pl.length){
  const po=!!e.po&&!lines.length,pdn=false;/* front-desk parts-only orders wait in Process for the owner to check */
  const fq=Math.floor(num(e.queue)),o={id:cid(e.id),queue:(!po&&fq>0)?fq:nextQ(d,po),plate,eng,motor:T(e.motor),cust:T(e.cust),phone:T(e.phone),addr:T(e.addr),date:d,
   lines:po?[]:(lines.length?lines:[{id:uid(),sid:"",name:"",price:0,mech:"",pj:""}]),pl,
   disc:Math.max(0,num(e.disc)),discT:e.discT==="pct"?"pct":"rp",discN:T(e.discN),po,status:pdn?"Done":"Waiting",due:"",done:pdn?d:"",edited:today(),
   log:e.note?[{id:uid(),date:d,note:"Front desk: "+T(e.note)}]:[]};
  stockSync([],o.pl);D.orders.unshift(o);add++}
 return add}
/* ---- notification when new front-desk data arrives ---- */
const FDN={pkb:0,po:0,ov:0,np:0},FDT0=document.title;
function fdBeep(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const a=new C(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.setValueAtTime(.15,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.5);o.start();o.stop(a.currentTime+.5);setTimeout(()=>{try{a.close()}catch(e){}},700)}catch(e){}try{navigator.vibrate&&navigator.vibrate([120,60,120])}catch(e){}}
function fdTxt(){const r=[];if(FDN.pkb)r.push(FDN.pkb+" PKB");if(FDN.po)r.push(FDN.po+" Sparepart only");if(FDN.ov)r.push(FDN.ov+" Turmes");if(FDN.np)r.push(FDN.np+" sparepart baru");return r.join(" · ")}
function fdBanner(){
 let b=document.getElementById("fdnote");
 const tot=FDN.pkb+FDN.po+FDN.ov+FDN.np;
 if(!tot){if(b)b.remove();document.title=FDT0;return}
 if(!b){b=document.createElement("div");b.id="fdnote";b.setAttribute("role","status");b.style.cssText="position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:9999;max-width:560px;margin:0 auto;background:var(--card);color:var(--tx);border:2px solid var(--ac);border-radius:12px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.25)";document.body.appendChild(b)}
 const perm=(window.Notification&&Notification.permission==="default")?`<div style="margin-top:6px"><a href="#" style="color:var(--ac);font-size:12px" onclick="fdAsk();return false">🔔 Aktifkan notifikasi perangkat</a></div>`:"";
 b.innerHTML=`<div style="display:flex;gap:8px;align-items:center;justify-content:space-between"><div><b style="color:var(--ac)">🔔 Data baru dari front desk</b><div style="margin-top:2px">${fdTxt()}</div></div><div style="display:flex;gap:6px;flex-shrink:0"><button class="btn p" onclick="fdGo()">Lihat</button><button class="btn" onclick="fdDismiss()" aria-label="Tutup">✕</button></div></div>${perm}`;
 document.title="("+tot+") "+FDT0}
function fdDismiss(){FDN.pkb=FDN.po=FDN.ov=FDN.np=0;fdBanner()}
function fdGo(){const onlyNp=FDN.np&&!FDN.pkb&&!FDN.po&&!FDN.ov,onlyPo=FDN.po&&!FDN.pkb&&!FDN.ov;if(onlyNp)tab="parts";else{tab="proc";PRS=onlyPo?"po":"svc"}fdDismiss();draw();window.scrollTo(0,0)}
function fdAsk(){try{Notification.requestPermission().then(()=>fdBanner())}catch(e){}}
function fdNotify(c){
 FDN.pkb+=c.pkb;FDN.po+=c.po;FDN.ov+=c.ov;FDN.np+=c.np;fdBanner();fdBeep();
 try{if(window.Notification&&Notification.permission==="granted"){const t="Front desk: data baru";const x=new Notification(t,{body:fdTxt(),tag:"fd-new"});x.onclick=()=>{try{window.focus()}catch(e){}fdGo();x.close()}}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")fdPull()});
async function fdPull(){
 if(!SY.token||!SY.gid||syBusy||fdBusy||(document.visibilityState==="hidden"&&!(window.Notification&&Notification.permission==="granted")))return;
 fdBusy=true;
 try{
  const g=await gh("/gists/"+SY.gid);fdFail=0;const f=g.files&&g.files[FDF];if(!f)return;
  let t=f.content;if(f.truncated||t==null){const r=await fetch(f.raw_url,{cache:"no-store"});t=await r.text()}
  const E=A((JSON.parse(t)||{}).entries);let add=0,n=0;const cnt={pkb:0,po:0,ov:0,np:0};
  const cand=E.filter(e=>e&&e.id&&!fdSeen.has(e.id)&&!D.orders.some(o=>o.id===cid(e.id))&&!D.ovh.some(o=>o.id===cid(e.id)));
  const cloudHas=new Set();
  if(cand.length){/* the main data file lives in the same gist: learn deletions made on other devices before importing */
   const cf=g.files&&g.files[GF];if(cf&&!cf.truncated&&cf.content){try{const cd=JSON.parse(cf.content);A(cd.fdDel).forEach(x=>{x=cid(x);if(x&&!D.fdDel.includes(x))D.fdDel.push(x)});
    /* already imported by another device (cloud data has it): never import it a second time */
    A(cd.orders).concat(A(cd.ovh)).forEach(o=>{if(o&&o.id&&!D.fdDel.includes(cid(o.id)))cloudHas.add(cid(o.id))})}catch(x){}}}
  let skipped=0;
  for(const e of cand){
   if(cloudHas.has(cid(e.id))){fdSeen.add(e.id);skipped++;continue}
   if(fdGone(e.id)||(e.kind==="part"&&fdGone(e.pid))){fdSeen.add(e.id);skipped++;continue}
   const r=fdApply(e)||0;add+=r;fdSeen.add(e.id);n++;if(r>0){cnt[e.kind==="ovh"?"ov":e.kind==="part"?"np":(e.po&&!A(e.lines).length)?"po":"pkb"]++}
  }
  if(E.some(fdDead))fdPurge(g);
  if(skipped&&!n)try{localStorage.setItem(FDK,JSON.stringify([...fdSeen].slice(-500)))}catch(x){}
  if(n){try{localStorage.setItem(FDK,JSON.stringify([...fdSeen].slice(-500)))}catch(x){}save();draw();try{toast(n+" new from front desk")}catch(x){}if(cnt.pkb+cnt.po+cnt.ov+cnt.np)fdNotify(cnt)}
 }catch(e){fdFail++}finally{fdBusy=false}
}
/* poll fast while the screen is open; slow down if GitHub keeps failing */
function fdLoop(){const v=document.visibilityState==="visible",d=(v?3000:15000)*(1+Math.min(fdFail,5)*2);setTimeout(async()=>{try{await fdPull()}catch(e){}fdLoop()},d)}
fdLoop();setTimeout(fdPull,800);
addEventListener("focus",()=>fdPull());addEventListener("online",()=>fdPull());
async function syForce(dir){
 if(!SY.token||syBusy)return;
 if(!confirm(dir==="up"?"Overwrite the cloud copy with this device's data?":"Overwrite this device's data with the cloud copy?"))return;
 syBusy=true;syMsg("Working…");
 try{
  if(!SY.gid){SY.gid=await syFind();sySave()}
  if(dir==="up"){await syPush();syMsg("Uploaded ("+syT_()+").")}
  else{if(!SY.gid)throw new Error("No cloud copy exists yet");syPull(await syGet());syMsg("Downloaded ("+syT_()+").")}
 }catch(e){syMsg("Failed: "+(e&&e.message||e),true)}
 finally{syBusy=false;if(tab==="sync"){const m=SY.msg;draw();syMsg(m,m.startsWith("Failed"))}}
}
async function syOn(){
 const t=(document.getElementById("sytok").value||"").trim();if(!t){syMsg("Paste your token first.",true);return}
 SY.token=t;syMsg("Checking token…");
 try{const u=await gh("/user");SY.gid="";SY.base=0;sySave();syMsg("Connected as "+u.login+".");draw();sySync(true)}
 catch(e){SY.token="";syMsg("Could not connect: "+(e&&e.message||e),true)}
}
function syOff(){if(confirm("Disconnect this device from cloud sync? Your data stays on this device and in the cloud.")){clearTimeout(syT);SY.token="";SY.gid="";SY.base=0;SY.last=0;SY.msg="";sySave();draw()}}
function dl(name,blob){const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function jBackup(){dl("work-orders-backup-"+today()+".json",new Blob([JSON.stringify(D,null,1)],{type:"application/json"}))}
function jRestore(inp){
 const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=e=>{try{const x=JSON.parse(e.target.result);if(!x||!Array.isArray(x.orders))throw new Error("not a backup from this app");
  if(!confirm("Replace all current data with this backup?"))return;
  D=norm(x);MECH.splice(0,MECH.length,...D.mechs);sortM();O=blank();save();draw();syMsg("Backup restored.")}catch(err){syMsg("Restore failed: "+err.message,true)}};
 r.readAsText(f);inp.value="";
}
function vSync(){
 const on=!!SY.token,sm="font-size:13px;color:var(--mu)";
 return `<div class="card"><h2>Cloud sync (GitHub)</h2>
 <p style="${sm};margin:0 0 10px">Keeps your data the same on every phone and computer. It is stored in a <b>private Gist in your own GitHub account</b>, never in the public repository. The app keeps working offline and syncs when you are back online.</p>
 ${on?`<div class="sum"><div><span>Status</span><b class="store">Connected</b></div><div><span>Cloud copy</span><b>${SY.gid?"found":"will be created"}</b></div><div><span>Last sync</span><b>${SY.last?esc(new Date(SY.last).toLocaleString()):"-"}</b></div></div>
 <label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--tx);margin:10px 0"><input type="checkbox" style="width:auto" ${SY.auto?"checked":""} onchange="SY.auto=this.checked;sySave()"> Sync automatically after changes</label>
 <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn p" onclick="sySync(true)">⟳ Sync now</button><button class="btn" onclick="syForce('up')">⬆ Force upload</button><button class="btn" onclick="syForce('down')">⬇ Force download</button><button class="btn" style="color:#b91c1c" onclick="syOff()">Disconnect</button></div>`
 :`<label>GitHub token</label><input id="sytok" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ghp_…">
 <div style="margin:10px 0"><button class="btn p" onclick="syOn()">Connect</button></div>
 <ol style="${sm};padding-left:18px;margin:0">
 <li>On GitHub open Settings → Developer settings → Personal access tokens → <b>Tokens (classic)</b>.</li>
 <li>Generate a new token, tick only the <b>gist</b> scope, and copy it.</li>
 <li>Paste it above and press Connect. Repeat on your other devices with the same token.</li></ol>
 <p style="${sm}">The token is kept only in this browser. Do not share it.</p>`}
 <p id="symsg" style="${sm};margin:10px 0 0">${esc(SY.msg||"")}</p></div>
 <div class="card"><h2>Backup file</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="jBackup()">⬇ Download backup (.json)</button><label class="btn" style="margin:0;font-size:15px;color:var(--tx)">⬆ Restore backup<input type="file" accept=".json,application/json" style="display:none" onchange="jRestore(this)"></label></div>
 <p style="${sm};margin:8px 0 0">Use this to move data from an older copy of the app. Excel export and import are on the History tab.</p></div>`;
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")sySync(false)});
window.addEventListener("online",()=>sySync(false));
draw();
sySync(false);
</script>
